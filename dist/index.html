<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01040b">
<meta name="description" content="A scroll-driven journey through the ocean, with sea creatures drawn in fluorescent particles and a generative deep-sea score.">
<title>Luminous Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Krona+One&family=Sora:wght@300;400;500&display=swap">
<style>/* Layout: full-bleed WebGL water column behind fixed text panels.
   Desktop: copy on the left, creature on the right, creature rail on the far right.
   Phone: creature in the upper half, copy anchored to the bottom over a scrim.
   UI chrome uses the Loyel blue scale; the creatures carry the colour. */
:root {
  --abyss: #01040b;
  --ink: #e8eef6;        /* Loyel 20 */
  --ink-soft: #ccdbeb;   /* Loyel 30 */
  --label: #9fbdda;      /* Loyel 40 */
  --rule: #6c9ac4;       /* Loyel 50 */
  --deep: #263b54;       /* Loyel 100 */
  --neon-core: #e6faff;  /* the lit glass tube of the hollow letters */
  --neon: #38c8ff;       /* fluorescent blue glow */
  --neon-halo: #376392;  /* Loyel 70, the wide outer halo */
  --accent: #38c8ff;

  --f-display: "Krona One", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Sora", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --gutter: clamp(16px, 5.5vw, 96px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; background: var(--abyss); }
body {
  margin: 0;
  background: var(--abyss);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: pan-y;
}

#track > div { height: 100vh; height: 100lvh; scroll-snap-align: start; }

/* ---------- hollow neon type ---------- */
.neon {
  color: transparent;
  -webkit-text-stroke: var(--stroke, 1.5px) var(--neon-core);
  filter:
    drop-shadow(0 0 1px var(--neon))
    drop-shadow(0 0 5px var(--neon))
    drop-shadow(0 0 16px var(--neon))
    drop-shadow(0 0 34px var(--neon-halo));
}
.neon .ln { display: block; white-space: nowrap; }
.neon .ch { display: inline-block; }
.panel.is-active .neon .ch { animation: neon-on 1.5s calc(var(--d, 0) * 55ms + 120ms) both; }
@keyframes neon-on {
  0% { opacity: 0; }
  7% { opacity: 0.9; }
  11% { opacity: 0.1; }
  19% { opacity: 1; }
  24% { opacity: 0.3; }
  32%, 100% { opacity: 1; }
}

/* ---------- panels ---------- */
#panels { position: relative; z-index: 2; }
.panel {
  position: fixed;
  inset: 0;
  display: grid;
  align-items: center;
  padding-inline: var(--gutter);
  padding-block: 88px 64px;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  will-change: opacity, transform;
}
.copy {
  display: grid;
  gap: 16px;
  max-width: min(44vw, 640px);
  min-width: 0;
}
.copy a, .copy button { pointer-events: auto; }

.eyebrow {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--label);
}
.eyebrow .idx { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

.name {
  --stroke: 1.6px;
  margin: 4px 0 0;
  font-family: var(--f-display);
  font-weight: 400;
  line-height: 1.02;
  letter-spacing: 0.02em;
  font-size: clamp(30px, min(7.2vw, calc(46vw / var(--len, 8))), 132px);
}
.latin {
  margin: -4px 0 0;
  font-family: var(--f-mono);
  font-size: 12px;
  font-style: italic;
  letter-spacing: 0.04em;
  color: var(--label);
}
.line {
  --stroke: 0.9px;
  margin: 2px 0 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(17px, 1.75vw, 27px);
  line-height: 1.32;
  letter-spacing: 0.03em;
  text-wrap: balance;
}
.body {
  margin: 0;
  max-width: 52ch;
  color: var(--ink-soft);
  font-weight: 300;
  font-size: clamp(14px, 1.05vw, 16px);
  text-shadow: 0 0 18px var(--abyss), 0 0 4px var(--abyss);
}
.facts {
  margin: 6px 0 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid color-mix(in srgb, var(--rule) 40%, transparent);
}
.facts > div { padding: 12px 14px 0 0; min-width: 0; }
.facts dt {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--rule);
}
.facts dd {
  margin: 2px 0 0;
  overflow-wrap: break-word;
  hyphens: auto;
  font-size: 15px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* rise-in for the plain-type parts of the active panel */
.panel .rise { transition: transform 0.9s cubic-bezier(.2,.7,.1,1), opacity 0.9s; }
.panel:not(.is-active) .rise { transform: translateY(12px); opacity: 0.4; }
.panel.is-active .rise:nth-child(4) { transition-delay: 0.15s; }
.panel.is-active .rise:nth-child(5) { transition-delay: 0.25s; }
.panel.is-active .rise:nth-child(6) { transition-delay: 0.35s; }

/* hero + outro: centred over the whirlpool / sea */
.panel--center { justify-items: center; text-align: center; }
.panel--center .copy { justify-items: center; max-width: min(92vw, 1100px); }
.panel--center .name { font-size: clamp(26px, min(12vw, calc(88vw / var(--len, 8))), 210px); --stroke: 2px; }
.panel--center .line { font-size: clamp(19px, 2.3vw, 34px); }
.panel--center .body { max-width: 56ch; }
.panel--outro .name { font-size: clamp(24px, min(8.5vw, calc(86vw / var(--len, 8))), 150px); --stroke: 1.6px; }

.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
.cta {
  appearance: none;
  border: 1px solid color-mix(in srgb, var(--neon) 70%, transparent);
  background: color-mix(in srgb, var(--abyss) 55%, transparent);
  color: var(--neon-core);
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 14px 22px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 18px -4px var(--neon), inset 0 0 14px -6px var(--neon);
  transition: box-shadow 0.3s, background 0.3s, transform 0.3s;
}
.cta:hover { box-shadow: 0 0 28px -2px var(--neon), inset 0 0 18px -4px var(--neon); transform: translateY(-1px); }
.cta--quiet { border-color: color-mix(in srgb, var(--rule) 50%, transparent); box-shadow: none; color: var(--label); }
.cta:focus-visible, .rail button:focus-visible, .sound:focus-visible, .brand:focus-visible {
  outline: 2px solid var(--neon);
  outline-offset: 3px;
}
.credits {
  margin: 10px 0 0;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--rule);
  text-transform: uppercase;
}

/* ---------- chrome ---------- */
.topbar {
  position: fixed;
  z-index: 5;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) var(--gutter) 18px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
}
.brand span { color: transparent; -webkit-text-stroke: 0.7px var(--neon-core); filter: drop-shadow(0 0 4px var(--neon)); }
.sound {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--rule) 45%, transparent);
  background: color-mix(in srgb, var(--abyss) 50%, transparent);
  color: var(--label);
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
}
.sound[aria-pressed="true"] { color: var(--neon-core); border-color: color-mix(in srgb, var(--neon) 70%, transparent); box-shadow: 0 0 16px -6px var(--neon); }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.bars i { display: block; width: 2px; height: 3px; background: currentColor; border-radius: 1px; }
.sound[aria-pressed="true"] .bars i { animation: bar 1.1s ease-in-out infinite alternate; }
.sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.4s; }
.sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -0.8s; }
.sound[aria-pressed="true"] .bars i:nth-child(4) { animation-delay: -0.2s; }
.sound[aria-pressed="true"] .bars i:nth-child(5) { animation-delay: -0.6s; }
@keyframes bar { from { height: 2px; } to { height: 12px; } }

.rail {
  position: fixed;
  z-index: 4;
  right: calc(var(--gutter) * 0.45);
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  gap: 4px;
}
.rail button {
  appearance: none;
  background: none;
  border: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding: 5px 0;
  cursor: pointer;
  color: var(--rule);
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.rail .lbl { opacity: 0; transform: translateX(6px); transition: opacity 0.3s, transform 0.3s; }
.rail button:hover .lbl, .rail button[aria-current="true"] .lbl { opacity: 1; transform: none; }
.rail button[aria-current="true"] { color: var(--ink); }
.rail .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.rail button[aria-current="true"] .dot { background: var(--c, var(--neon)); border-color: var(--c, var(--neon)); box-shadow: 0 0 10px var(--c, var(--neon)); }

.hint {
  position: fixed;
  z-index: 3;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 8px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--label);
  transition: opacity 0.5s;
  pointer-events: none;
}
.hint i { width: 1px; height: 34px; background: linear-gradient(var(--neon), transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

.loader {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  background: var(--abyss);
  transition: opacity 1s ease, visibility 1s;
}
.loader-word { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 56px); letter-spacing: 0.06em; --stroke: 1.2px; animation: neon-on 2.4s infinite; }
.loader-note { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--label); font-variant-numeric: tabular-nums; }
body.ready .loader { opacity: 0; visibility: hidden; }

.noscript { position: fixed; inset: auto 16px 24px; z-index: 20; color: var(--ink); font-family: var(--f-mono); text-align: center; }

/* ---------- phone / portrait ---------- */
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  .panel { align-items: end; padding-block: 72px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .panel--side::before {
    content: "";
    position: absolute;
    inset: 42% 0 0 0;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--abyss) 82%, transparent) 38%);
    z-index: -1;
  }
  .copy { max-width: 100%; gap: 12px; }
  .name { font-size: clamp(26px, min(15vw, calc(84vw / var(--len, 8))), 96px); }
  .panel { padding-inline: 16px 30px; }
  .facts dd { font-size: 14px; }
  .line { font-size: clamp(17px, 4.6vw, 24px); }
  .panel--center { align-items: center; }
  .rail { right: 8px; gap: 0; }
  .rail .lbl { display: none; }
  .rail .dot { width: 6px; height: 6px; }
  .hint { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-height: 720px) and (max-aspect-ratio: 1/1) {
  .panel--side .body { display: none; }
}
@media (max-height: 560px) {
  .panel .body { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-snap-type: none; }
  .panel.is-active .neon .ch, .loader-word, .hint i, .sound[aria-pressed="true"] .bars i { animation: none; }
  .panel .rise { transition: none; }
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader" class="loader" role="status" aria-live="polite">
  <p class="loader-word neon">LUMINOUS DEEP</p>
  <p class="loader-note"><span id="loader-count">0</span> particles waking up</p>
</div>

<header class="topbar">
  <a class="brand" href="#top" data-go="0">Luminous <span>Deep</span></a>
  <button id="sound" class="sound" type="button" aria-pressed="false">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="sound-label">Sound off</span>
  </button>
</header>

<nav id="rail" class="rail" aria-label="Creatures"></nav>

<main id="panels"></main>

<div id="track" aria-hidden="true"></div>

<div id="hint" class="hint" aria-hidden="true"><span>Scroll to descend</span><i></i></div>

<noscript>
  <p class="noscript">Luminous Deep draws its creatures with WebGL and JavaScript. Turn JavaScript on to dive in.</p>
</noscript>
