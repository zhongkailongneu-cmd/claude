<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader" class="loader" role="status" aria-live="polite">
  <p class="loader-word neon">SOLAR SYSTEM</p>
  <p class="loader-note">正在点亮 <span id="loader-count">0</span> 颗粒子</p>
</div>

<header class="topbar">
  <a class="brand" href="#top" data-go="0">Particle <span>Solar</span></a>
  <div class="tools">
    <div class="palette" role="radiogroup" aria-label="粒子配色">
      <button type="button" role="radio" data-palette="multi" aria-checked="true">多色</button>
      <button type="button" role="radio" data-palette="mono" aria-checked="false">单色</button>
    </div>
    <button id="sound" class="pill sound" type="button" aria-pressed="false" aria-label="声音">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="sound-label">声音 关</span>
    </button>
    <button id="settings-btn" class="pill gear" type="button" aria-expanded="false" aria-controls="settings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
      <span>设置</span>
    </button>
  </div>
</header>

<aside id="settings" class="settings" aria-label="页面设置" hidden>
  <div class="settings-head">
    <h2>设置</h2>
    <button type="button" class="close" data-close aria-label="关闭设置">×</button>
  </div>

  <section>
    <h3>粒子配色</h3>
    <div class="seg" role="radiogroup" aria-label="粒子配色">
      <button type="button" role="radio" data-palette="multi" aria-checked="true"><b>多色</b><small>按 NASA 真彩色影像</small></button>
      <button type="button" role="radio" data-palette="mono" aria-checked="false"><b>单色</b><small>蓝色荧光 · 橙色太阳</small></button>
    </div>
  </section>

  <section>
    <label class="row" for="s-glow"><span>粒子荧光强度</span><output id="o-glow">70</output></label>
    <input id="s-glow" type="range" min="0" max="100" step="1" value="70">
    <p class="note">调到 0 即为原网页那种不发光的普通粒子。</p>
  </section>

  <section>
    <label class="row" for="s-tglow"><span>文字荧光强度</span><output id="o-tglow">70</output></label>
    <input id="s-tglow" type="range" min="0" max="100" step="1" value="70">
  </section>

  <section>
    <h3>英文字体颜色</h3>
    <div class="seg" role="radiogroup" aria-label="英文字体颜色">
      <button type="button" role="radio" data-textcolor="blue" aria-checked="true"><b><i class="swatch swatch--blue" aria-hidden="true"></i>蓝色荧光</b><small>冷光霓虹（默认）</small></button>
      <button type="button" role="radio" data-textcolor="orange" aria-checked="false"><b><i class="swatch swatch--orange" aria-hidden="true"></i>橙色荧光</b><small>接近太阳的琥珀色</small></button>
    </div>
  </section>

  <section>
    <label class="row" for="s-font"><span>英文字体</span></label>
    <select id="s-font">
      <option value="oswald">Oswald（参考站字体）</option>
      <option value="bebas">Bebas Neue</option>
      <option value="orbitron">Orbitron</option>
      <option value="michroma">Michroma</option>
      <option value="syncopate">Syncopate</option>
    </select>
    <p class="font-preview neon" id="font-preview" aria-hidden="true">SATURN</p>
  </section>

  <section>
    <label class="row" for="s-size"><span>字号</span><output id="o-size">100%</output></label>
    <input id="s-size" type="range" min="80" max="125" step="1" value="100">
  </section>

  <section>
    <label class="row" for="s-music"><span>背景音乐音量</span><output id="o-music">70</output></label>
    <input id="s-music" type="range" min="0" max="100" step="1" value="70">
    <label class="row" for="s-sfx"><span>交互音效音量</span><output id="o-sfx">70</output></label>
    <input id="s-sfx" type="range" min="0" max="100" step="1" value="70">
  </section>

  <div class="settings-foot">
    <button type="button" class="cta cta--quiet" data-reset>恢复默认</button>
    <p class="keys">快捷键：<kbd>C</kbd> 切换配色 · <kbd>T</kbd> 字体颜色 · <kbd>M</kbd> 声音 · <kbd>S</kbd> 设置</p>
  </div>
</aside>

<nav id="rail" class="rail" aria-label="天体导航"></nav>

<main id="panels"></main>

<div id="track" aria-hidden="true"></div>

<div id="hint" class="hint" aria-hidden="true"><span>向下滚动 · 出发</span><i></i></div>

<noscript>
  <p class="noscript">这个页面用 WebGL 和 JavaScript 绘制粒子，请开启 JavaScript。</p>
</noscript>
