<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>诸葛亮的大脑</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --c10:#F4F7FB;--c20:#E8EEF6;--c30:#CCDBEB;--c40:#9FBDDA;--c50:#6C9AC4;
  --c60:#497DAE;--c70:#376392;--c80:#2E5076;--c90:#2B4868;--c100:#263B54;
  --serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--c100)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);color:#fff;background:var(--c100)}
#bg{position:absolute;left:0;top:0}
svg text{font-family:var(--sans)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
.abs{position:absolute}
.hdr{position:absolute;left:100px;top:50px}
.hdr .row{display:flex;align-items:center;gap:24px}
.pill{background:var(--c70);color:#fff;font-size:26px;font-weight:500;padding:6px 20px;border-radius:999px;letter-spacing:.1em}
.hdr .ttl{font-family:var(--serif);font-weight:900;font-size:62px;letter-spacing:.06em;line-height:1.15}
.hdr .sub{margin-top:8px;font-size:26px;color:var(--c40);letter-spacing:.04em}
.lc{position:absolute;left:100px;top:212px;width:860px;height:620px}
.quote{position:absolute;left:0;top:0;width:860px;background:var(--c10);color:var(--c100);border-left:10px solid var(--c70);border-radius:6px;padding:24px 34px 18px}
.quote .qt{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.5}
.quote .qs{margin-top:6px;font-size:22px;color:var(--c60);text-align:right}
.quote .q{color:var(--c70)}
.diag{position:absolute;left:0;top:200px;overflow:visible}
.brainbox{position:absolute;left:1070px;top:178px}
.ev{position:absolute;left:1070px;top:632px;width:750px;background:rgba(46,80,118,.94);border-left:6px solid var(--c50);border-radius:6px;padding:16px 26px 18px}
.ev .k{display:inline-block;font-size:20px;padding:2px 12px;border-radius:4px;background:var(--c70);color:#fff;margin-right:14px;vertical-align:middle}
.ev .k.k2{background:var(--c40);color:var(--c100)}
.ev .k.k3{background:var(--c60)}
.ev .c{display:inline-block;font-size:22px;color:var(--c30);vertical-align:middle;letter-spacing:.01em}
.ev .t{margin-top:8px;font-size:27px;line-height:1.48;color:#fff}
.ev .q{color:var(--c40)}
.card{position:absolute;background:rgba(46,80,118,.92);border-left:6px solid var(--c40);border-radius:6px;padding:16px 28px}
.card .ct{font-size:25px;color:var(--c40);font-weight:500;letter-spacing:.04em}
.card .cq{font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.45;margin-top:6px;color:var(--c10)}
.card .cs{font-size:20px;color:var(--c40);margin-top:4px}
.card .q{color:var(--c30)}
#capwrap{position:absolute;left:0;top:800px;width:1920px;height:280px;background:linear-gradient(to bottom,rgba(38,59,84,0),rgba(38,59,84,.86) 34%,rgba(38,59,84,.96))}
#cap{position:absolute;left:170px;width:1580px;top:872px;height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;line-height:1.5;font-weight:500;letter-spacing:.02em}
#cap > div{text-wrap:balance}
#cap .q{color:var(--c40)}
#cap .tag{display:inline-block;font-size:28px;line-height:1.4;padding:2px 12px;margin-right:12px;border-radius:4px;background:var(--c70);vertical-align:5px}
#prog{position:absolute;left:0;top:0;height:5px;background:var(--c50)}
#nav{position:absolute;right:72px;top:30px;display:flex;gap:20px;font-size:20px;color:var(--c60);letter-spacing:.06em}
#nav span.on{color:#fff}
.sumcard{position:absolute;width:480px;height:168px;background:rgba(46,80,118,.92);border-radius:8px;border:2px solid var(--c60);padding:16px 22px 0 92px}
.sumcard .n{position:absolute;left:20px;top:20px;width:54px;height:54px;border-radius:50%;background:var(--c70);font-family:var(--serif);font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center}
.sumcard .st{font-family:var(--serif);font-weight:900;font-size:38px;letter-spacing:.05em}
.sumcard .s1{font-size:25px;color:var(--c30);margin-top:4px}
.sumcard .s2{font-size:21px;color:var(--c40);margin-top:4px}
.sumcard.dash{border:2px dashed var(--c40);background:rgba(43,72,104,.7)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#CCDBEB" stop-opacity="1"/>
        <stop offset=".35" stop-color="#9FBDDA" stop-opacity=".8"/>
        <stop offset=".7" stop-color="#6C9AC4" stop-opacity=".35"/>
        <stop offset="1" stop-color="#376392" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="brainFill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#376392" stop-opacity=".55"/>
        <stop offset="1" stop-color="#2B4868" stop-opacity=".75"/>
      </linearGradient>
      <radialGradient id="dotGlow">
        <stop offset="0" stop-color="#F4F7FB" stop-opacity="1"/>
        <stop offset=".4" stop-color="#CCDBEB" stop-opacity=".7"/>
        <stop offset="1" stop-color="#6C9AC4" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
  <div id="scenes"></div>
  <div id="capwrap"></div>
  <div id="cap"></div>
  <div id="nav"></div>
  <div id="prog"></div>
</div>
<script>
'use strict';
const W = 1920, H = 1080;
const C = {c10:'#F4F7FB',c20:'#E8EEF6',c30:'#CCDBEB',c40:'#9FBDDA',c50:'#6C9AC4',c60:'#497DAE',c70:'#376392',c80:'#2E5076',c90:'#2B4868',c100:'#263B54'};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, parent, html) {
  const el = document.createElement(tag);
  for (const k in attrs) { if (k === 'style') el.style.cssText = attrs[k]; else if (k === 'class') el.className = attrs[k]; else el.setAttribute(k, attrs[k]); }
  if (html !== undefined) el.innerHTML = html;
  if (parent) parent.appendChild(el);
  return el;
}
function s(tag, attrs = {}, parent, text) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  if (parent) parent.appendChild(el);
  return el;
}
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// 「」 quotes are tinted; 【】 become small tags.
const fmt = t => esc(t).replace(/【(.+?)】/g, '<span class="tag">$1</span>').replace(/「(.+?)」/g, '<span class="q">「$1」</span>');
// HTML element in/out: p in [0,1]
function show(el, p, dy = 22, dx = 0, sc = null) {
  el.style.opacity = p;
  el.style.transform = `translate(${dx * (1 - p)}px,${dy * (1 - p)}px)` + (sc ? ` scale(${lerp(sc, 1, p)})` : '');
  el.style.visibility = p <= 0.001 ? 'hidden' : 'visible';
}
const op = (el, v) => el.setAttribute('opacity', clamp(v));
const win = (lt, a, b, fi = .5, fo = .4) => Math.min(ease((lt - a) / fi), b === undefined ? 1 : ease((b - lt) / fo));

/* ---------------- background: slow neural mesh ---------------- */
const bg = document.getElementById('bg').getContext('2d');
const nodes = []; { const R = rnd(11); for (let i = 0; i < 72; i++) nodes.push({ x: R() * W, y: R() * H, ax: 18 + R() * 36, ay: 18 + R() * 36, fx: .04 + R() * .06, fy: .04 + R() * .06, ph: R() * 6.283, r: 1.4 + R() * 2.2 }); }
function drawBG(t) {
  const g = bg.createRadialGradient(W * .55, H * .42, 80, W * .55, H * .42, 1250);
  g.addColorStop(0, '#2E5076'); g.addColorStop(.55, '#2B4868'); g.addColorStop(1, '#263B54');
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  const P = nodes.map(n => [n.x + n.ax * Math.sin(t * n.fx + n.ph), n.y + n.ay * Math.cos(t * n.fy + n.ph * 1.3)]);
  bg.lineWidth = 1.2;
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], d = Math.hypot(dx, dy);
    if (d < 200) { bg.strokeStyle = `rgba(73,125,174,${(1 - d / 200) * .22})`; bg.beginPath(); bg.moveTo(P[i][0], P[i][1]); bg.lineTo(P[j][0], P[j][1]); bg.stroke(); }
  }
  P.forEach((p, i) => {
    const n = nodes[i], flash = Math.max(0, Math.sin(t * .55 + n.ph * 5) - .93) / .07;
    bg.fillStyle = `rgba(108,154,196,${.45 + .4 * flash})`;
    bg.beginPath(); bg.arc(p[0], p[1], n.r + flash * 2.5, 0, 6.283); bg.fill();
  });
}

/* ---------------- schematic brain (lateral view, frontal pole on the left) ---------------- */
const BR = {
  cer: 'M150,275 C145,190 215,120 310,102 C400,85 500,100 560,150 C605,190 625,250 610,305 C600,340 570,358 535,358 C510,380 470,392 425,390 C370,390 310,385 275,365 C255,352 245,335 255,320 C230,322 200,330 175,320 C158,312 152,295 150,275 Z',
  cbl: 'M500,368 C540,372 585,362 602,334 C618,362 604,402 562,414 C530,422 498,406 492,386 Z',
  folia: ['M512,380 C545,384 580,375 600,352', 'M520,395 C550,398 580,390 598,372'],
  stem: 'M440,382 C446,418 452,442 456,472 L488,472 C486,442 484,414 488,386 Z',
  sulci: ['M255,322 C310,305 370,290 440,285', 'M385,98 C375,150 385,200 370,255', 'M200,185 C240,172 272,178 305,160', 'M178,240 C220,230 262,236 305,222',
    'M445,128 C468,168 500,180 545,188', 'M425,200 C468,214 512,224 565,240', 'M300,348 C350,338 405,336 470,330', 'M560,282 C580,298 592,312 604,318',
    'M232,132 C252,150 258,175 250,200', 'M520,300 C540,320 545,335 538,350', 'M330,120 C320,150 330,170 322,195'],
};
// region: centre (brain coords), size, whether it is a deep structure, label position (svg coords)
const REG = {
  dlpfc: { x: 238, y: 192, rx: 62, ry: 54, label: '背外侧前额叶 DLPFC', tx: 24, ty: 52, lx: 150, ly: 62 },
  mpfc: { x: 176, y: 270, rx: 44, ry: 44, label: '内侧前额叶 mPFC（示意）', tx: 20, ty: 446, lx: 150, ly: 416 },
  amy: { x: 298, y: 340, rx: 18, ry: 18, deep: 1, label: '杏仁核', tx: 330, ty: 506, lx: 360, ly: 482 },
  hip: { x: 392, y: 346, rx: 74, ry: 22, deep: 1, label: '海马 / 内嗅皮层', tx: 610, ty: 508, lx: 650, ly: 486 },
  tpj: { x: 478, y: 262, rx: 50, ry: 46, label: '颞顶联合区 TPJ', tx: 850, ty: 150, lx: 770, ly: 160, end: 1 },
  str: { x: 335, y: 236, rx: 32, ry: 26, deep: 1, label: '背侧纹状体', tx: 560, ty: 44, lx: 590, ly: 54 },
};
const BX = 110, BY = 20;
function makeBrain(parent, { labels = true, w = 700, note = true } = {}) {
  const svg = s('svg', { viewBox: '0 0 860 520', width: w, height: w * 520 / 860, style: 'overflow:visible' }, parent);
  const g = s('g', { transform: `translate(${BX},${BY})` });
  const back = s('g', {}, g);
  const stem = s('path', { d: BR.stem, fill: C.c90, stroke: C.c50, 'stroke-width': 2.2, pathLength: 1 }, back);
  const cbl = s('path', { d: BR.cbl, fill: C.c90, stroke: C.c50, 'stroke-width': 2.2, pathLength: 1 }, back);
  const fol = BR.folia.map(d => s('path', { d, fill: 'none', stroke: C.c60, 'stroke-width': 1.8, pathLength: 1 }, back));
  const cer = s('path', { d: BR.cer, fill: 'url(#brainFill)', stroke: C.c40, 'stroke-width': 3.2, pathLength: 1, 'stroke-linejoin': 'round' }, g);
  const sul = BR.sulci.map(d => s('path', { d, fill: 'none', stroke: C.c50, 'stroke-width': 2.2, 'stroke-linecap': 'round', pathLength: 1 }, g));
  const regs = {};
  const lab = s('g', {});
  for (const k in REG) {
    const r = REG[k];
    const gg = s('g', { opacity: 0 }, g);
    const glow = s('ellipse', { cx: r.x, cy: r.y, rx: r.rx * 1.5, ry: r.ry * 1.5, fill: 'url(#glow)' }, gg);
    const ring = s('ellipse', { cx: r.x, cy: r.y, rx: r.rx, ry: r.ry, fill: 'none', stroke: C.c10, 'stroke-width': 2, 'stroke-dasharray': r.deep ? '7 6' : 'none', opacity: .85 }, gg);
    let lg = null;
    if (labels) {
      lg = s('g', { opacity: 0 }, lab);
      const px = r.x + BX, py = r.y + BY;
      s('path', { d: `M${px},${py} L${r.lx},${r.ly}`, stroke: C.c30, 'stroke-width': 1.6, fill: 'none' }, lg);
      s('circle', { cx: px, cy: py, r: 4, fill: C.c10 }, lg);
      s('text', { x: r.tx, y: r.ty, fill: '#FFFFFF', 'font-size': 25, 'font-weight': 500, 'text-anchor': r.end ? 'end' : 'start' }, lg, r.label);
    }
    regs[k] = { gg, glow, ring, lg, r, ph: Object.keys(regs).length * 1.7 };
  }
  svg.appendChild(g); svg.appendChild(lab);
  let noteEl = null;
  if (labels && note) noteEl = s('text', { x: 850, y: 18, fill: C.c40, 'font-size': 18, 'text-anchor': 'end' }, svg, '示意图 · 虚线为深部结构');
  const outline = [stem, cbl, cer, ...fol, ...sul];
  return {
    svg,
    draw(p) { // stroke draw-on, then fill fades in
      outline.forEach((e, i) => { const q = clamp(p * 1.25 - (i > 2 ? .25 : 0)); e.setAttribute('stroke-dasharray', '1 1'); e.setAttribute('stroke-dashoffset', 1 - q); });
      const f = clamp((p - .55) / .45); [cer].forEach(e => e.setAttribute('fill-opacity', f)); [stem, cbl].forEach(e => e.setAttribute('fill-opacity', f));
      if (noteEl) op(noteEl, f);
    },
    set(k, v, t, lab = v) {
      const R = regs[k]; const pulse = .82 + .18 * Math.sin(t * 3.1 + R.ph);
      op(R.gg, v); R.glow.setAttribute('opacity', pulse);
      const sc = 1 + .05 * Math.sin(t * 3.1 + R.ph);
      R.glow.setAttribute('rx', R.r.rx * 1.5 * sc); R.glow.setAttribute('ry', R.r.ry * 1.5 * sc);
      if (R.lg) op(R.lg, lab);
    },
    dim(v) { op(g, v); },
    // page-space position of a region, given where the svg sits
    pos(k, left, top) { const R = REG[k], sc = w / 860; return [left + (R.x + BX) * sc, top + (R.y + BY) * sc]; },
  };
}
function brainBox(root, opts) { const box = h('div', { class: 'brainbox' }, root); return makeBrain(box, opts); }

/* ---------------- shared scene chrome ---------------- */
function header(root, tag, title, sub) {
  const el = h('div', { class: 'hdr' }, root);
  const row = h('div', { class: 'row' }, el);
  h('span', { class: 'pill' }, row, tag); h('span', { class: 'ttl' }, row, title);
  h('div', { class: 'sub' }, el, sub);
  return el;
}
function quote(parent, text, src, o = {}) {
  const el = h('div', { class: 'quote' }, parent);
  h('div', { class: 'qt', style: o.size ? `font-size:${o.size}px` : '' }, el, fmt(text));
  if (o.extra) h('div', { class: 'qt', style: 'font-size:31px;margin-top:2px' }, el, fmt(o.extra));
  h('div', { class: 'qs' }, el, src);
  return el;
}
const KCLS = { '循证': '', '概念': 'k3', '推断': 'k3', '史料': 'k2', '争议': 'k2', '注': 'k2' };
function evCards(root, list) {
  const cards = list.map(c => { const el = h('div', { class: 'ev' }, root); h('span', { class: 'k ' + KCLS[c.k] }, el, c.k); h('span', { class: 'c' }, el, c.c); h('div', { class: 't' }, el, fmt(c.t)); return { el, c }; });
  return (lt, at, dur) => cards.forEach((x, i) => {
    const st = at(x.c.at) + (x.c.off || 0);
    const en = i < cards.length - 1 ? at(cards[i + 1].c.at) + (cards[i + 1].c.off || 0) : dur + 1;
    show(x.el, win(lt, st, en, .55, .35), 16);
  });
}
function svgBox(parent, w, hgt, cls = 'diag') { return s('svg', { class: cls, width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}` }, parent); }
function txt(parent, x, y, str, o = {}) {
  return s('text', Object.assign({ x, y, fill: '#FFFFFF', 'font-size': 26, 'text-anchor': 'middle' }, o), parent, str);
}
// quadratic arrow that stops short of node edges; returns setter for draw progress
function arrow(parent, x0, y0, cx, cy, x1, y1, o = {}) {
  const r0 = o.r0 || 0, r1 = o.r1 || 0;
  const u0 = [cx - x0, cy - y0], l0 = Math.hypot(...u0); x0 += u0[0] / l0 * r0; y0 += u0[1] / l0 * r0;
  const u1 = [x1 - cx, y1 - cy], l1 = Math.hypot(...u1); x1 -= u1[0] / l1 * r1; y1 -= u1[1] / l1 * r1;
  const g = s('g', { opacity: 0 }, parent);
  const p = s('path', { d: `M${x0},${y0} Q${cx},${cy} ${x1},${y1}`, fill: 'none', stroke: o.color || C.c30, 'stroke-width': o.w || 4, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1' }, g);
  const a = Math.atan2(u1[1], u1[0]) * 180 / Math.PI, hs = o.head || 16;
  const head = s('path', { d: `M0,0 L${-hs},${-hs * .55} L${-hs},${hs * .55} Z`, fill: o.color || C.c30, transform: `translate(${x1},${y1}) rotate(${a})` }, g);
  let lab = null;
  if (o.label) lab = txt(g, o.lx, o.ly, o.label, { 'font-size': o.fs || 23, fill: o.lc || C.c30 });
  return { g, set(v) { op(g, v > 0 ? 1 : 0); p.setAttribute('stroke-dashoffset', 1 - clamp(v)); op(head, (v - .85) / .15); if (lab) op(lab, (v - .5) / .5); }, path: p };
}

/* ---------------- scenes ---------------- */
const SCENES = [];
const scenesEl = document.getElementById('scenes');
function scene(def) { def.root = h('div', { class: 'scene' }, scenesEl); def.build(def.root, def); SCENES.push(def); }

/* 0 · title */
scene({
  nav: null, fixed: 9.5, caps: [],
  build(root, S) {
    const box = h('div', { class: 'abs', style: 'left:540px;top:96px' }, root);
    S.b = makeBrain(box, { labels: false, w: 840 });
    S.t1 = h('div', { class: 'abs', style: 'left:0;width:1920px;top:640px;text-align:center;font-family:var(--serif);font-weight:900;font-size:128px;letter-spacing:.16em' }, root, '诸葛亮的大脑');
    S.t2 = h('div', { class: 'abs', style: 'left:0;width:1920px;top:820px;text-align:center;font-size:46px;color:#CCDBEB;letter-spacing:.06em' }, root, fmt('用现代神经科学，拆解一位「用脑高手」'));
    S.t3 = h('div', { class: 'abs', style: 'left:0;width:1920px;top:900px;text-align:center;font-size:28px;color:#9FBDDA;letter-spacing:.12em' }, root, '诸葛亮 · 字孔明 · 181—234 · 琅琊阳都人 · 蜀汉丞相');
  },
  update(lt, at, S) {
    S.b.draw(ease((lt - .2) / 3.2));
    ['dlpfc', 'mpfc', 'tpj', 'hip', 'amy', 'str'].forEach((k, i) => S.b.set(k, clamp(Math.sin(clamp((lt - 2.6 - i * .45) / 2.4) * Math.PI)) * .9, lt));
    show(S.t1, ease((lt - 2.2) / 1.1), 30); show(S.t2, ease((lt - 3.3) / 1), 20); show(S.t3, ease((lt - 4.1) / 1), 16);
  },
});

/* 1 · method */
scene({
  nav: '序', caps: [
    '先立一条规矩：我们无法扫描一千八百年前的大脑。',
    '本片只采信正史：陈寿《三国志》，以及裴松之注所引的史料。',
    '草船借箭、借东风出自小说，空城计早被裴松之驳斥——一概不用。',
    '神经科学在这里是一面「解释透镜」，而不是对古人的诊断。',
  ],
  build(root, S) {
    S.hd = header(root, '序', '先立规矩', '史料边界 · 方法论');

      h('div', { class: 'n' }, el, n); h('div', { class: 'st' }, el, t); h('div', { class: 's1' }, el, a); h('div', { class: 's2' }, el, b);
      let ln = null, dot = null;
      { const k = BW / 860, [ax, ay] = anchors[i], px = BL + ax * k, py = BT + ay * k; const sx = x < 900 ? x + 480 : x, sy = y + 84; ln = s('path', { d: `M${sx},${sy} C${(sx + px) / 2},${sy} ${(sx + px) / 2},${py} ${px},${py}`, stroke: C.c40, 'stroke-width': 2, fill: 'none', pathLength: 1, 'stroke-dasharray': '1 1', opacity: .8 }, lines); dot = s('circle', { cx: px, cy: py, r: 5, fill: C.c30, opacity: 0 }, lines); }
      return { el, ln, dot, reg };
    });
    S.big = h('div', { class: 'abs', style: 'left:0;width:1920px;top:380px;text-align:center' }, root,
      `<div style="font-family:var(--serif);font-weight:900;font-size:84px;letter-spacing:.08em">${fmt('「神机妙算」不是魔法')}</div><div style="margin-top:34px;font-size:42px;color:#CCDBEB;letter-spacing:.04em">而是一个被长期训练、又懂得保护自己的</div><div style="margin-top:14px;font-family:var(--serif);font-weight:900;font-size:60px;color:#F4F7FB;letter-spacing:.1em">规划型大脑</div>`);
    S.veil = h('div', { class: 'abs', style: 'left:0;top:0;width:1920px;height:1080px;background:#263B54;opacity:0' }, root);
    root.appendChild(S.big);
  },
  update(lt, at, S) {
    show(S.hd, ease(lt / .8), 16);
    S.b.draw(ease((lt - .2) / 1.8));
    S.cards.forEach((c, i) => {
      const st = at(i + 1); show(c.el, ease((lt - st) / .6), 0, i % 2 === 0 && i < 4 || i === 4 ? -40 : 40);
      c.ln.setAttribute('stroke-dashoffset', 1 - ease((lt - st - .3) / .8)); op(c.dot, ease((lt - st - 1) / .3));
      if (c.reg) S.b.set(c.reg, ease((lt - st - .5) / .8), lt);
    });
    if (lt > at(1)) S.b.set('mpfc', ease((lt - at(1) - .5) / .8), lt);
    const fin = ease((lt - at(7)) / .9);
    S.veil.style.opacity = fin * .82; show(S.big, fin, 30);
  },
});

/* 9 · references + end */
scene({
  nav: null, fixed: 15, caps: [],
  build(root, S) {
    S.wrap = h('div', { class: 'abs', style: 'left:150px;top:90px;width:1620px' }, root);
    h('div', { style: 'font-family:var(--serif);font-weight:900;font-size:50px;letter-spacing:.1em' }, S.wrap, '参考资料');
    h('div', { style: 'margin-top:22px;font-size:25px;color:#CCDBEB;line-height:1.6' }, S.wrap, '<span style="color:#9FBDDA">史料 ·</span> 陈寿《三国志》（诸葛亮传、马良传）及裴松之注所引《魏略》《汉晋春秋》《襄阳记》《魏氏春秋》；《晋书·宣帝纪》；诸葛亮《诫子书》');
    const refs = ['Tse et al. (2007) Science', 'Chase & Simon (1973) Cognitive Psychology', 'Constantinescu et al. (2016) Science', 'Schacter & Addis (2007) Phil Trans R Soc B', 'Daw, Niv & Dayan (2005) Nature Neuroscience', 'Behrens et al. (2018) Neuron', 'Saxe & Kanwisher (2003) NeuroImage', 'Coricelli & Nagel (2009) PNAS', 'Arnsten (2009) Nature Reviews Neuroscience',
      'Yerkes & Dodson (1908) J Comp Neurol Psychol', 'Ochsner & Gross (2005) Trends Cogn Sci', 'Cowan (2001) Behavioral and Brain Sciences', 'Risko & Gilbert (2016) Trends Cogn Sci', 'Clark & Chalmers (1998) Analysis', 'Krause et al. (2017) Nature Reviews Neuroscience', 'Xie et al. (2013) Science', 'Nickerson (1998) Review of General Psychology', 'Mitchell, Macrae & Banaji (2006) Neuron'];
    h('div', { style: 'margin-top:26px;font-size:25px;color:#9FBDDA' }, S.wrap, '神经科学 · 按出现顺序');
    const grid = h('div', { style: 'margin-top:12px;display:grid;grid-template-columns:1fr 1fr;column-gap:60px;row-gap:10px;font-size:25px;color:#E8EEF6' }, S.wrap);
    const col = [refs.slice(0, 9), refs.slice(9)];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 2; c++) h('div', {}, grid, col[c][r]);
    h('div', { style: 'margin-top:34px;font-size:24px;color:#9FBDDA' }, S.wrap, '本片为科普解读：神经科学在此用作解释透镜，不构成对历史人物的医学或心理诊断。');
    S.end = h('div', { class: 'abs', style: 'left:0;width:1920px;top:430px;text-align:center' }, root, '<div style="font-family:var(--serif);font-weight:900;font-size:100px;letter-spacing:.2em">诸葛亮的大脑</div><div style="margin-top:26px;font-size:34px;color:#9FBDDA;letter-spacing:.3em">完</div>');
  },
  update(lt, at, S) {
    show(S.wrap, Math.min(ease(lt / .9), ease((10.2 - lt) / .7)), 20);
    show(S.end, Math.min(ease((lt - 10.6) / 1), ease((S.dur - .2 - lt) / 1.2)), 20);
  },
});

/* ---------------- timeline ---------------- */
let T = 0; const CAPS = [];
for (const S of SCENES) {
  S.start = T; S.capT = [];
  if (S.fixed) S.dur = S.fixed;
  else {
    let t = 1.3;
    for (const c of S.caps) {
      const text = typeof c === 'string' ? c : c.t;
      const n = [...text.replace(/[\s【】「」（）]/g, '')].length;
      const d = (typeof c === 'object' && c.d) || clamp(n / 6 + 1.3, 3.6, 9);
      // typeof check: String.prototype.big exists, so a plain string would read as big
      S.capT.push({ s: t, e: t + d, text, big: typeof c === 'object' && !!c.big }); CAPS.push({ s: S.start + t, e: S.start + t + d, text });
      t += d;
    }
    S.dur = t + 1;
  }
  T += S.dur;
}
const TOTAL = T;
const nav = document.getElementById('nav'); const navItems = SCENES.filter(S => S.nav).map(S => { S.navEl = h('span', {}, nav, S.nav); return S; });
const cap = document.getElementById('cap'), capwrap = document.getElementById('capwrap'), prog = document.getElementById('prog');
let lastCap = null;
window.__render = t => {
  drawBG(t);
  let cur = null;
  for (const S of SCENES) {
    const lt = t - S.start;
    if (lt < 0 || lt >= S.dur) { S.root.style.display = 'none'; continue; }
    S.root.style.display = 'block'; cur = S;
    S.root.style.opacity = Math.min(ease(lt / .5), ease((S.dur - lt) / .45));
    S.update(lt, i => S.capT[i] ? S.capT[i].s : S.dur, S);
  }
  let ctext = '', cop = 0, show_bar = 0;
  if (cur && cur.capT.length) {
    const lt = t - cur.start;
    show_bar = Math.min(ease((lt - .6) / .6), ease((cur.dur - lt) / .5));
    for (const c of cur.capT) if (lt >= c.s && lt < c.e && !c.big) { ctext = c.text; cop = Math.min(ease((lt - c.s) / .3), ease((c.e - lt) / .25)); }
    if (cur.capT.some(c => c.big && lt >= c.s - .2)) show_bar *= 0;
  }
  if (ctext !== lastCap) { cap.innerHTML = '<div>' + fmt(ctext) + '</div>'; lastCap = ctext; }
  cap.style.opacity = cop; capwrap.style.opacity = show_bar;
  prog.style.width = (t / TOTAL * 100) + '%';
  const navOp = cur && cur.nav ? 1 : 0; nav.style.opacity = navOp;
  navItems.forEach(S => S.navEl.className = S === cur ? 'on' : '');
};
window.__timeline = { total: TOTAL, scenes: SCENES.map(S => ({ start: S.start, dur: S.dur, nav: S.nav })), caps: CAPS };
window.__ready = true;
window.__render(0);
</script>
