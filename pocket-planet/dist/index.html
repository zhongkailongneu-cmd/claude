<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263B54">
<meta name="description" content="A walkable low-poly pocket planet with four seasons: sakura brook, firefly camp, harvest cabin and an aurora-lit snow peak.">
<title>Pocket Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&family=ZCOOL+XiaoWei&display=swap">
<style>/* Layout: full-bleed WebGL planet; the HUD floats on top — brand and landmark
   card top-left, key help top-right, season dock bottom-centre. */
:root {
  --space-0: #263B54;
  --space-1: #2B4868;
  --space-2: #2E5076;
  --glass: rgba(244, 247, 251, 0.9);
  --line: #CCDBEB;
  --ink: #263B54;
  --ink-2: #2B4868;
  --ink-3: #497DAE;
  --main: #376392;
  --paper: #F4F7FB;
  --f-display: "Fredoka", "Nunito", "Varela Round", system-ui, sans-serif;
  --f-han: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background:
    radial-gradient(60% 50% at 78% 18%, rgba(108, 154, 196, 0.22), transparent 70%),
    radial-gradient(50% 45% at 14% 86%, rgba(73, 125, 174, 0.2), transparent 70%),
    radial-gradient(120% 95% at 50% 48%, var(--space-2) 0%, var(--space-1) 42%, var(--space-0) 100%);
  background-color: var(--space-0);
  color: var(--ink);
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#scene:active { cursor: grabbing; }

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
}
.hud-inner { position: relative; height: 100%; }

/* ---------- brand */
.brand { position: absolute; top: 0; left: 0; display: flex; align-items: baseline; gap: 10px; color: var(--paper); }
.brand p { margin: 0; }
.brand-en { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; }
.brand-zh { font-family: var(--f-han); font-size: 16px; color: #CCDBEB; letter-spacing: 0.12em; }

/* ---------- landmark card */
.card {
  --accent: #E98BA8;
  --accent-soft: #FBE3EA;
  position: absolute;
  top: 44px;
  left: 0;
  width: min(352px, 100%);
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  padding: 16px 18px 14px 14px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 14px 40px rgba(38, 59, 84, 0.38);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transform-origin: 30px 30px;
}
.card.pop { animation: card-pop 0.62s cubic-bezier(0.2, 1.35, 0.4, 1) both; }
@keyframes card-pop {
  0% { opacity: 0; transform: translateY(-10px) scale(0.92); }
  100% { opacity: 1; transform: none; }
}
.hex {
  clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
  display: grid;
  place-items: center;
}
.card-glyph {
  width: 62px;
  height: 56px;
  clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
  display: grid;
  place-items: center;
  background: var(--accent);
  color: #FFFFFF;
  font-family: var(--f-han);
  font-size: 30px;
  line-height: 1;
}
.card-body { min-width: 0; }
.card-body p { margin: 0; }
.card-eyebrow { font-family: var(--f-display); font-weight: 500; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.card-title { margin: 3px 0 0; font-family: var(--f-han); font-weight: 400; font-size: 26px; line-height: 1.15; color: var(--ink); letter-spacing: 0.04em; text-wrap: balance; }
.card-en { font-family: var(--f-display); font-size: 14px; color: var(--ink-2); margin-top: 2px !important; }
.card-desc { margin-top: 8px !important; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.card-meta { margin-top: 10px !important; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip { font-family: var(--f-body); font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink-2); }
.chip.here { background: var(--accent); color: #FFFFFF; }

/* ---------- help */
.help {
  position: absolute; top: 0; right: 0;
  padding: 10px 14px;
  background: rgba(38, 59, 84, 0.55);
  border: 1px solid rgba(159, 189, 218, 0.35);
  border-radius: 14px;
  color: #E8EEF6;
  font-size: 12.5px;
  line-height: 1.9;
  backdrop-filter: blur(6px);
}
.help p { margin: 0; }
kbd {
  display: inline-block; min-width: 1.5em; padding: 0 5px; margin-right: 3px;
  font-family: var(--f-mono); font-size: 11px; line-height: 1.6; text-align: center;
  color: var(--ink); background: #E8EEF6; border-radius: 5px; box-shadow: 0 2px 0 #9FBDDA;
}

/* ---------- banner */
.banner {
  --accent: #E98BA8;
  position: absolute; left: 50%; top: 21%;
  transform: translate(-50%, 8px);
  display: grid; justify-items: center; gap: 4px;
  padding: 14px 26px 16px;
  border-radius: 20px;
  background: rgba(38, 59, 84, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #FFFFFF; opacity: 0;
  text-shadow: 0 2px 12px rgba(38, 59, 84, 0.6);
  white-space: nowrap;
}
.banner strong { font-family: var(--f-han); font-weight: 400; font-size: clamp(34px, 6vw, 54px); letter-spacing: 0.24em; padding-left: 0.24em; }
.banner span { font-family: var(--f-display); font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; padding: 3px 12px; border-radius: 999px; background: var(--accent); text-shadow: none; }
.banner.show { animation: banner 2.6s ease both; }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, 10px); }
  14%, 72% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -6px); }
}

/* ---------- dock */
.dock {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 4px;
  padding: 7px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 14px 40px rgba(38, 59, 84, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.dock-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 14px 5px 6px;
  border: 0; border-radius: 14px;
  background: transparent;
  color: var(--ink-2);
  font: 500 14px/1 var(--f-display);
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
.dock-btn .hex {
  width: 36px; height: 32px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--f-han); font-size: 18px;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.dock-btn:hover { background: #FFFFFF; }
.dock-btn:hover .hex { transform: none; }
.dock-btn:active { transform: translateY(1px); }
.dock-btn:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }
.dock-btn[aria-current="true"], .dock-btn[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.dock-btn[aria-current="true"] .hex, .dock-btn[aria-pressed="true"] .hex { background: var(--accent); color: #FFFFFF; }
.dock-btn.overview .lbl { font-family: var(--f-body); font-size: 13.5px; }
.dock-sep { width: 1px; margin: 6px 3px; background: var(--line); }

/* ---------- touch controls */
.touch { display: none; }
.joystick {
  position: absolute; left: 6px; bottom: 96px;
  width: 116px; height: 116px; border-radius: 50%;
  background: rgba(244, 247, 251, 0.18);
  border: 1.5px solid rgba(232, 238, 246, 0.55);
  pointer-events: auto; touch-action: none;
}
.knob {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: rgba(244, 247, 251, 0.92); box-shadow: 0 4px 14px rgba(38, 59, 84, 0.4);
}
.jump-btn {
  position: absolute; right: 6px; bottom: 110px;
  width: 68px; height: 62px; border: 0;
  clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
  background: rgba(244, 247, 251, 0.9); color: var(--main);
  font-family: var(--f-han); font-size: 24px;
  pointer-events: auto; touch-action: none;
}

@media (hover: none) and (pointer: coarse) {
  .touch { display: block; }
  .help { display: none; }
}

@media (max-width: 720px) {
  .help { display: none; }
  .brand-en { font-size: 18px; }
  .brand-zh { font-size: 14px; }
  .card { top: 36px; width: 100%; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 12px 14px 12px 12px; }
  .card-glyph { width: 48px; height: 44px; font-size: 24px; }
  .card-title { font-size: 21px; }
  .card-desc { font-size: 12.5px; margin-top: 5px !important; }
  .dock { left: 0; right: 0; transform: none; justify-content: space-between; padding: 6px; border-radius: 18px; }
  .dock-btn { flex: 1 1 0; flex-direction: column; gap: 4px; padding: 6px 2px; font-size: 11.5px; min-width: 0; }
  .dock-btn.overview .lbl { font-size: 11.5px; }
  .dock-sep { margin: 8px 0; }
  .banner { top: 34%; }
  .joystick { bottom: 92px; }
  .jump-btn { bottom: 104px; }
}

@media (prefers-reduced-motion: reduce) {
  .card.pop, .banner.show { animation-duration: 0.01s; }
  .banner.show { animation: none; opacity: 1; transform: translate(-50%, 0); }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="四季掌心星球：可行走的 3D 低多边形星球"></canvas>

<div class="hud">
  <div class="hud-inner">
    <header class="brand">
      <p class="brand-en">Pocket Planet</p>
      <p class="brand-zh">四季掌心星球</p>
    </header>

    <section class="card" id="card" aria-live="polite">
      <div class="card-glyph" id="cardGlyph" aria-hidden="true">春</div>
      <div class="card-body">
        <p class="card-eyebrow" id="cardEyebrow">Spring · 春之境</p>
        <h2 class="card-title" id="cardTitle">樱花溪桥</h2>
        <p class="card-en" id="cardEn">Sakura Brook Bridge</p>
        <p class="card-desc" id="cardDesc">朱红拱桥跨过潺潺小溪，花瓣顺着水流漂向下游。</p>
        <p class="card-meta"><span id="cardCoord">6°N · 42°E</span><span class="chip" id="cardDist">约 3 步</span></p>
      </div>
    </section>

    <aside class="help" aria-label="操作说明">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 行走与转向</p>
      <p><kbd>Shift</kbd> 奔跑 · <kbd>Space</kbd> 跳跃</p>
      <p>拖拽 环顾 · 滚轮 缩放</p>
      <p><kbd>1</kbd>–<kbd>4</kbd> 四季 · <kbd>V</kbd> 俯瞰</p>
    </aside>

    <div class="banner" id="banner" aria-hidden="true">
      <strong id="bannerZh">春之境</strong>
      <span id="bannerEn">Spring Realm</span>
    </div>

    <div class="touch">
      <div class="joystick" id="joy" aria-label="移动摇杆"><div class="knob"></div></div>
      <button class="jump-btn" id="jumpBtn" type="button" aria-label="跳跃">跳</button>
    </div>

    <nav class="dock" aria-label="四季视角跳转">
      <button class="dock-btn" type="button" data-season="0" style="--accent:#E98BA8;--accent-soft:#FBE3EA" aria-current="true">
        <span class="hex" aria-hidden="true">春</span><span class="lbl">Spring</span>
      </button>
      <button class="dock-btn" type="button" data-season="1" style="--accent:#4E9A52;--accent-soft:#DDEFD9">
        <span class="hex" aria-hidden="true">夏</span><span class="lbl">Summer</span>
      </button>
      <button class="dock-btn" type="button" data-season="2" style="--accent:#D9693A;--accent-soft:#F8E1D2">
        <span class="hex" aria-hidden="true">秋</span><span class="lbl">Autumn</span>
      </button>
      <button class="dock-btn" type="button" data-season="3" style="--accent:#497DAE;--accent-soft:#E8EEF6">
        <span class="hex" aria-hidden="true">冬</span><span class="lbl">Winter</span>
      </button>
      <span class="dock-sep" aria-hidden="true"></span>
      <button class="dock-btn overview" type="button" id="overviewBtn" aria-pressed="true" style="--accent:#376392;--accent-soft:#E8EEF6">
        <span class="hex" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="6.2"></circle>
            <ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-20 12 12)"></ellipse>
          </svg>
        </span><span class="lbl">全景俯瞰</span>
      </button>
    </nav>
  </div>
</div>
