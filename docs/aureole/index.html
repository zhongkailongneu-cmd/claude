/* AUREOLE · layout concept: one black stage, one object at a time.
   Glass UI + dot-matrix surfaces + comet transitions, driven by a single timeline.
   Theme tokens below are overwritten from JS (three palettes); defaults = Loyel. */
:root {
  color-scheme: dark;
  --bg: #000;
  --ink: #fff;
  --ink2: rgba(255, 255, 255, .64);
  --ink3: rgba(255, 255, 255, .38);
  --font: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-soon: 'Open Sans', 'Montserrat', ui-sans-serif, system-ui, sans-serif;
  --acc: #6C9AC4;  --acc-rgb: 108,154,196;
  --soft: #9FBDDA; --soft-rgb: 159,189,218;
  --light: #CCDBEB; --light-rgb: 204,219,235;
  --glow: #6C9AC4; --glow-rgb: 108,154,196;
  --btn: #497DAE;
  --onbtn: #fff;
  --edge-rgb: 159,189,218;
  --cube: #9FBDDA;
  --kw: #9FBDDA;
  --h0: rgba(38,59,84,.4); --h1: #2B4868; --h2: #376392; --h3: #6C9AC4; --h4: #CCDBEB;
  --b0: #263B54; --b1: #376392; --b2: #9FBDDA;
  /* scene sizes, written by layout() */
  --tw: 620px; --cubeS: 150px; --stageH: 150px; --prW: 520px; --prH: 322px; --cpW: 460px; --cpH: 196px;
  --tkW: 500px; --tkH: 244px; --cmW: 520px;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--soft); outline-offset: 3px; }

#stage { position: fixed; inset: 0; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; }

/* ambient light: three slow blobs tinted by the active palette */
#amb { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: .55; }
#amb i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(var(--glow-rgb), .22), rgba(var(--glow-rgb), .08) 55%, rgba(var(--glow-rgb), 0)); will-change: transform; }
#amb i:nth-child(1) { left: -20vmax; top: -30vmax; animation: drift1 26s ease-in-out infinite alternate; }
#amb i:nth-child(2) { right: -25vmax; bottom: -35vmax; animation: drift2 32s ease-in-out infinite alternate; }
#amb i:nth-child(3) { left: 30vw; top: 30vh; width: 50vmax; height: 50vmax; opacity: .6; animation: drift3 38s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.1); } }
@keyframes drift3 { to { transform: translate(-12vmax, 14vmax) scale(.9); } }

canvas#fxb, canvas#fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }

#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.scene { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
.scene.on { visibility: visible; }
.hd { margin: 0; font-weight: 500; letter-spacing: -.012em; line-height: 1.1; color: var(--ink2); white-space: nowrap; display: flex; gap: .3em; align-items: baseline; }
.hd .kw { font-weight: 700; color: var(--kwc, #fff); }

/* word / text swap: two stacked layers in one grid cell */
.sw { display: inline-grid; position: relative; }
.sw > i { grid-area: 1 / 1; font-style: normal; white-space: nowrap; will-change: transform, opacity, filter; }

/* ───────── glass ───────── */
.glass {
  position: relative; border-radius: var(--r, 28px);
  background:
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.085), rgba(255,255,255,0) 55%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012) 45%, rgba(255,255,255,.03));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -16px 26px -18px rgba(255,255,255,.09),
    0 28px 60px -24px rgba(0,0,0,.9);
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
}
.glass::before { /* gradient hairline edge */
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: linear-gradient(140deg, rgba(255,255,255,.78), rgba(255,255,255,.14) 30%, rgba(255,255,255,.07) 62%, rgba(255,255,255,.46));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.glass.tint::before { background: linear-gradient(140deg, rgba(var(--edge-rgb), .95), rgba(var(--edge-rgb), .22) 34%, rgba(var(--edge-rgb), .12) 62%, rgba(var(--edge-rgb), .6)); }
.glass.tint { box-shadow: inset 0 1px 0 rgba(var(--edge-rgb), .25), 0 0 46px -12px rgba(var(--glow-rgb), .45), 0 28px 60px -24px rgba(0,0,0,.9); }

/* ───────── S1 · Level ───────── */
.lv { position: absolute; left: 50%; top: 50%; width: var(--tw); margin-left: calc(var(--tw) / -2); }
.lv .hd { font-size: 46px; position: absolute; left: 0; top: calc(8px - var(--stageH) / 2 - 80px); }
.lv-stage { position: relative; height: var(--stageH); margin-top: calc(var(--stageH) / -2 + 8px); touch-action: none; pointer-events: auto; cursor: grab; }
.lv-stage:active { cursor: grabbing; }
.lv-stage canvas { position: absolute; left: 0; top: 0; }
.cube { position: absolute; left: 0; top: 0; width: var(--cubeS); height: var(--cubeS); margin-left: calc(var(--cubeS) / -2); will-change: transform; }
.cube-halo { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(var(--glow-rgb), .42), rgba(var(--glow-rgb), .12) 55%, rgba(var(--glow-rgb), 0)); }
.cube-glass { position: absolute; inset: 0; border-radius: 27%; overflow: hidden;
  background: radial-gradient(130% 120% at 28% 18%, rgba(255,255,255,.17), rgba(255,255,255,.02) 52%, rgba(255,255,255,.07)), rgba(6,9,16,.5);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), inset 0 0 24px rgba(var(--glow-rgb), .5), 0 0 30px rgba(var(--glow-rgb), .5);
  -webkit-backdrop-filter: blur(5px) saturate(160%); backdrop-filter: blur(5px) saturate(160%); }
.cube-in { position: absolute; inset: 14%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 9%; }
.cube-in b { border-radius: 24%; background: var(--cube); box-shadow: 0 0 14px rgba(var(--glow-rgb), .55); }
.cube-flash { position: absolute; inset: 0; border-radius: 27%; background: #fff; opacity: 0; mix-blend-mode: overlay; }
.cube-solid { position: absolute; inset: 0; border-radius: 27%; background: #fff; opacity: 0; box-shadow: 0 0 40px rgba(255,255,255,.8); }
.lv-sugg { position: absolute; top: 0; left: 0; width: 0; height: 0; opacity: 0; }
.lv-sugg .tick { position: absolute; left: -1.5px; width: 3px; height: 24px; border-radius: 2px; background: rgba(255,255,255,.82); box-shadow: 0 0 10px rgba(255,255,255,.5); }
.lv-sugg .lab { position: absolute; top: 72px; transform: translateX(-50%); white-space: nowrap; font-size: 17px; font-weight: 500; color: var(--ink2); }

/* ───────── S2 · Priority ───────── */
.pr { position: absolute; left: 50%; top: 50%; width: var(--prW); margin-left: calc(var(--prW) / -2); margin-top: calc(var(--prH) / -2 - 20px); }
.pr .hd { position: absolute; left: 4px; top: -50px; font-size: 27px; }
.pr-card { width: var(--prW); height: var(--prH); --r: 30px; pointer-events: auto; touch-action: none; cursor: crosshair; }
.pr-card canvas { position: absolute; left: 0; top: 0; border-radius: inherit; }
.ax { position: absolute; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink2); opacity: 0; }
.ax-u { top: 12px; left: 50%; transform: translateX(-50%); }

/* ───────── S3 · Capture ───────── */

.cp-text .wd { display: inline-block; white-space: pre; will-change: filter, opacity; }
.cp-card canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.cp-row { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 48px; }
.mic { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; pointer-events: auto;
  background: radial-gradient(100% 100% at 30% 20%, rgba(255,255,255,.14), rgba(255,255,255,.02));
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5), 0 0 26px -2px rgba(var(--glow-rgb), var(--micg, .6)); }
.mic svg, .send svg { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mic .ic-stop { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 4.5px; background: #fff; opacity: 0; }
.chip { position: absolute; left: 60px; top: 9px; height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 15px; font-size: 14px; font-weight: 500; color: var(--ink2);
  background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.chip svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rec { position: absolute; left: 62px; top: 0; height: 48px; display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0; }
.rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
.ondev { position: absolute; right: 8px; top: 0; height: 48px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--ink3); opacity: 0; }
.send { position: absolute; right: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; pointer-events: auto; color: #fff; background: rgba(255,255,255,.1); }
.send .fill { position: absolute; inset: 0; border-radius: 50%; background: var(--btn); opacity: 0; box-shadow: 0 0 22px rgba(var(--glow-rgb), .55); }
.send svg { color: var(--onbtn); opacity: .38; }

/* ───────── S4 · Task ───────── */
.tk { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
.tk-card { position: absolute; left: 0; top: 0; overflow: hidden; --r: 56px; transform: translate(-50%, -50%); background-color: rgba(0,0,0,.55); }
.tk-in { position: absolute; left: 50%; top: 50%; width: var(--tkW); height: var(--tkH); transform: translate(-50%, -50%); }
.tk-glowdot { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.7), rgba(var(--glow-rgb), .55) 38%, rgba(var(--glow-rgb), 0)); }
.ring { position: absolute; left: 26px; top: 26px; width: 62px; height: 62px; }
.ring svg.arc { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .core { position: absolute; left: 7px; top: 7px; right: 7px; bottom: 7px; border-radius: 50%; background: rgba(var(--soft-rgb), .12); box-shadow: inset 0 0 0 1px rgba(var(--soft-rgb), .25); display: grid; place-items: center; }
.ring .core svg { width: 26px; height: 26px; fill: none; stroke: var(--soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ring .fillc { position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; border-radius: 50%; background: var(--light); opacity: 0; display: grid; place-items: center; box-shadow: 0 0 26px rgba(var(--glow-rgb), .8); }
.ring .fillc svg { width: 28px; height: 28px; fill: none; stroke: #0c1424; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.spk { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--soft); opacity: 0; }
.tm { position: absolute; right: 30px; top: 22px; text-align: right; line-height: 1; }
.tm b { display: block; font-size: 40px; font-weight: 700; letter-spacing: -.01em; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm small { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: var(--ink2); }
.tk-title { position: absolute; left: 30px; top: 100px; margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.01em; }
.tk-title .strike { position: absolute; left: -3px; top: 56%; height: 2.5px; width: 0; border-radius: 2px; background: #fff; transform-origin: 0 50%; opacity: 0; box-shadow: 0 0 8px rgba(255,255,255,.6); }
.tk-sub { position: absolute; left: 30px; top: 139px; margin: 0; font-size: 16.5px; font-weight: 500; color: var(--ink2); }
.tk-sub b { color: var(--ink); font-weight: 600; }
.tk-bot { position: absolute; left: 30px; right: 22px; bottom: 22px; height: 52px; display: flex; align-items: center; gap: 14px; }
.slider { position: relative; flex: 1; height: 34px; min-width: 0; touch-action: none; pointer-events: auto; cursor: pointer; }
.slider canvas { position: absolute; left: 0; top: 0; }
.knob { position: absolute; top: 50%; left: 0; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.08); cursor: grab; display: grid; place-items: center; }
.knob svg { width: 16px; height: 16px; fill: none; stroke: #0c1424; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.xb, .cb { flex: none; border-radius: 50%; display: grid; place-items: center; pointer-events: auto; position: relative; }
.xb { width: 46px; height: 46px; background: rgba(255,255,255,.12); color: #fff; }
.cb { width: 52px; height: 52px; background: rgba(var(--acc-rgb), .22); box-shadow: inset 0 0 0 1.5px rgba(var(--soft-rgb), .22); color: var(--soft); }
.xb svg, .cb svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ───────── S5 · Completed ───────── */
.cm { position: absolute; left: 50%; top: 50%; width: var(--cmW); margin-left: calc(var(--cmW) / -2); margin-top: -250px; pointer-events: none; }
.cm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.cm-head h3 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.cm-head h3 svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.cm-head span { font-size: 13.5px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.cm-months { position: relative; height: 18px; font-size: 12px; font-weight: 500; color: var(--ink2); }
.cm-months em { position: absolute; top: 0; font-style: normal; white-space: nowrap; }
.cm-grid { display: grid; grid-template-columns: repeat(14, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 6px; margin-top: 2px; pointer-events: auto; }
.cm-grid i { display: block; aspect-ratio: 1; border-radius: 28%; background: var(--h0); will-change: transform, opacity, filter; transition: box-shadow .2s, transform .2s; }
.cm-grid i[data-l="1"] { background: var(--h1); } .cm-grid i[data-l="2"] { background: var(--h2); }
.cm-grid i[data-l="3"] { background: var(--h3); } .cm-grid i[data-l="4"] { background: var(--h4); }
.cm-grid i.today { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.32); }
.cm-grid i.void { visibility: hidden; }
.cm-grid i.hov { box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 18px rgba(var(--glow-rgb), .9); z-index: 2; }
.cm-leg { display: flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.cm-leg i { width: 11px; height: 11px; border-radius: 3.5px; display: inline-block; }
.cm-leg a { margin-left: auto; color: var(--soft); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.cm-leg a svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.cm-stats { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; padding: 18px 0 14px; border-top: 1px solid rgba(255,255,255,.1); border-bottom: 1px solid rgba(255,255,255,.1); }
.cm-stats div { min-width: 0; }
.cm-stats b { display: block; font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.cm-stats small { display: block; margin-top: 7px; font-size: 13px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.tip { position: absolute; left: 0; top: 0; padding: 6px 10px; border-radius: 9px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, -130%);
  background: rgba(20,22,28,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); transition: opacity .15s; z-index: 5; }
.tip small { display: block; font-weight: 500; color: var(--ink2); font-size: 11px; }

/* ───────── S6 · Welcome ───────── */
.wl { position: absolute; inset: 0; pointer-events: none; }
.wl-title { position: absolute; left: 50%; top: 50%; margin: 0; transform: translate(-50%, -50%); font-size: 46px; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; }
.wl-title span { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.wl-soon { position: absolute; left: var(--soonX, 8%); top: 50%; transform: translateY(-50%); font-family: var(--font-soon); font-size: 27px; font-weight: 600; line-height: 1.22; letter-spacing: .01em; color: rgba(255,255,255,.62); opacity: 0; }

.tap { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, rgba(255,255,255,.34), rgba(255,255,255,.16) 70%, rgba(255,255,255,0)); box-shadow: 0 0 0 1px rgba(255,255,255,.12); }

/* ───────── chrome ───────── */
.mark { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); font-size: 11px; font-weight: 700; letter-spacing: .42em; color: rgba(255,255,255,.34); pointer-events: none; }
#dock {
  position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; width: max-content; max-width: calc(100vw - 32px); padding: 7px 8px;
  border-radius: 22px; background: rgba(14,15,19,.62); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 40px -10px rgba(0,0,0,.8);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); opacity: .62; transition: opacity .25s;
}
#dock:hover, #dock:focus-within, #dock.touch { opacity: 1; }
#dock .sep { width: 1px; height: 20px; background: rgba(255,255,255,.14); }
.themes { display: flex; gap: 2px; }
.themes button { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 8px; border-radius: 17px; font-size: 12.5px; font-weight: 600; color: var(--ink2); transition: background .2s, color .2s; white-space: nowrap; }
.themes button:hover { color: #fff; background: rgba(255,255,255,.06); }
.themes button[aria-checked="true"] { color: #fff; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.themes .sw3 { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), 0 0 12px -1px var(--c, #fff); background: var(--g); }
.chap { display: flex; gap: 3px; }
.chap button { position: relative; height: 34px; padding: 0 9px; border-radius: 17px; font-size: 11.5px; font-weight: 600; color: var(--ink3); white-space: nowrap; overflow: hidden; transition: color .2s, background .2s; }
.chap button:hover { color: #fff; background: rgba(255,255,255,.06); }
.chap button i { position: absolute; left: 9px; right: 9px; bottom: 5px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.14); overflow: hidden; }
.chap button i::after { content: ''; position: absolute; inset: 0; background: var(--soft); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
.chap button.cur { color: #fff; }
.ctl { display: flex; gap: 2px; }
.ctl button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); transition: background .2s, color .2s; }
.ctl button:hover { color: #fff; background: rgba(255,255,255,.08); }
.ctl svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hint { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); font-size: 11px; font-weight: 500; letter-spacing: .06em; color: rgba(255,255,255,.3); pointer-events: none; text-align: right; }

@media (max-width: 760px) {
  .chap button { padding: 0 6px; font-size: 0; }
  .chap button i { left: 4px; right: 4px; bottom: 15px; height: 3px; }
  .themes button { padding: 0 10px 0 8px; font-size: 12px; }
  .hint { display: none; }
}
@media (max-width: 480px) {
  .themes button span { display: none; }
  .themes button { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) {
  #amb i { animation: none; }
}
.ring svg.arc circle { transform-box: fill-box; transform-origin: 50% 50%; }

</style>

<body>
<div id="stage">
  <div id="amb" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="fxb" aria-hidden="true"></canvas>

  <div id="world">
    <!-- 01 · Level -->

              <div class="cube-flash"></div>
            </div>
            <div class="cube-solid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 02 · Priority -->
    <section class="scene" id="s1" aria-label="Priority">

          <div class="cp-text" id="cpText"><span class="ph" id="ph">What’s on your mind today?</span><span id="words"></span></div>

          <div class="cp-row" id="cpRow">

              <svg id="icMic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
              <i class="ic-stop" id="icStop"></i>

          <div><b data-v="32" data-d="0">0</b><small>This month</small></div>
          <div><b data-v="7" data-d="0">0</b><small>Best day</small></div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <nav id="dock" aria-label="播放与色系控制">

      <button type="button" role="radio" data-theme="aurora" aria-checked="false" title="极光绿（按 3）"><i class="sw3" style="--g:linear-gradient(135deg,#153F34,#279470 40%,#5BCB9C 72%,#BDEBD6);--c:#5BCB9C"></i><span>极光绿</span></button>
    </div>

      s.style.opacity = (Math.pow(1 - sp, 1.2) * .95).toFixed(3);
      s.style.transform = `translate(${(Math.cos(ang) * dist).toFixed(1)}px,${(Math.sin(ang) * dist).toFixed(1)}px) scale(${(1 - sp * .5).toFixed(2)})`;
    });

    /* time + text */
    if (lt >= .95) {
      tk.scr.set(lt < 3.75 ? '1:02:13' : lt < 4.0 ? '1:02:12' : 'Done', lt >= 4.0 ? .5 : .75);
      tk.tkTime.style.fontSize = lt >= 4.0 ? '32px' : '';
    } else tk.scr.reset();
    tk.scr.tick();
    tk.tkLeft.style.opacity = sstep(1.3, 1.7, lt) * (1 - sstep(3.8, 4.0, lt));
    if (lt >= 1.0) {
      tk.sTitle.set(lt < 4.0 ? 'Finish the deck' : lt < 5.0 ? 'Deck finished' : lt < 5.9 ? `<span style="color:var(--soft);font-weight:500">1h 02m <span style="font-weight:400">early</span></span>` : 'Nice work.');
      tk.sSub.set(lt < 1.3 ? '' : lt < 2.3 ? 'Task · 25% left · due Mon 18:00' : lt < 3.9 ? 'Reminder <b>2</b> of <b>4</b> · next at <b>10%</b>' : '');
    } else { tk.sTitle.reset(); tk.sSub.reset(); }
    tk.sTitle.tick(); tk.sSub.tick();
    const st = eo3(prog(lt, 3.35, 3.8));
    tk.strike.style.width = (tk.sTitle.a.offsetWidth + 6) + 'px';
    tk.strike.style.transform = `scaleX(${st.toFixed(3)})`;
    tk.strike.style.opacity = st > 0 ? 1 - sstep(4.0, 4.2, lt) : 0;

    /* slider */
    const reveal = eo3(prog(lt, 1.15, 1.85));
    const script = lt < 3.3 ? .64 * reveal : lerp(.64, 1, eoB(prog(lt, 3.3, 3.9)));
    const prg = lerp(script, D.p, D.w);
    tk.prg = prg;
    const sw = U.sw;
    tk.knob.style.transform = `translateX(${(prg * sw).toFixed(2)}px)`;
    tk.knob.style.opacity = clamp(reveal * 3);
    tk.knob.style.background = rgba(mixc(WHITE, [170, 172, 184, 1], dim));
    tk.knobIc.style.opacity = sstep(4.1, 4.4, lt) * (1 - dim * .4);
    drawBar(lt, prg, sw, sstep(3.95, 4.5, lt), dim, reveal);

    const bg = mixc(mixc([TH.acc[0], TH.acc[1], TH.acc[2], .22], TH.light, done), [255, 255, 255, .12], dim);
    tk.cBtn.style.background = rgba(bg);
    tk.cBtn.style.color = rgba(mixc(mixc(TH.soft, [12, 20, 36, 1], done), [160, 162, 172, 1], dim));
    tk.cBtn.style.boxShadow = done > .01 && dim < .5 ? `0 0 ${(26 * done).toFixed(0)}px rgba(${rgb3(TH.glow)},${(.6 * done * (1 - dim)).toFixed(2)})` : 'none';
    tk.xBtn.style.opacity = 1 - .62 * done;
    if (lt > 2.85 && lt < 3.35) tapShow(tk.cBtn, prog(lt, 2.85, 3.35));
  },
});

function drawBar(lt, prg, sw, solid, dim, reveal) {
  const c = ctxs.bar, h = 34;
  c.clearRect(0, 0, sw, h);
  const a = clamp(reveal * 2) * (1 - .55 * dim);
  c.fillStyle = `rgba(255,255,255,${(.075 * a).toFixed(3)})`; rr(c, 0, 3, sw, h - 6, (h - 6) / 2); c.fill();
  const kx = prg * sw;
  if (kx > 4) {
    const pitch = 5.6, cols = Math.floor(kx / pitch);
    for (let i = 0; i < cols; i++) {
      const x = i * pitch + 3, f = x / kx, cc = f < .55 ? mixc(TH.b0, TH.b1, f / .55) : mixc(TH.b1, TH.b2, (f - .55) / .45);
      for (let r = -2; r <= 2; r++) {
        const rad = (.5 + 1.6 * Math.pow(f, 1.5)) * (Math.abs(r) === 2 ? .78 : 1);
        c.fillStyle = rgba(cc, clamp(.14 + .86 * Math.pow(f, 1.1)) * a * (1 - solid));
        c.beginPath(); c.arc(x, h / 2 + r * 5.4, rad, 0, 6.3); c.fill();
      }
    }
    if (solid > .01) {
      const g = c.createLinearGradient(0, 0, kx, 0);
      g.addColorStop(0, rgba(TH.b0)); g.addColorStop(.55, rgba(TH.b1)); g.addColorStop(1, rgba(TH.b2));
      c.globalAlpha = solid * a; c.fillStyle = g; rr(c, 0, 4, Math.max(kx, 8), h - 8, (h - 8) / 2); c.fill(); c.globalAlpha = 1;
    }
    c.fillStyle = `rgba(255,255,255,${(.8 * a * (1 - solid)).toFixed(3)})`;
    if (kx > sw * .46) { c.beginPath(); c.arc(sw * .42, h / 2, 2, 0, 6.3); c.fill(); }
  }
  const ahead = 1 - solid;
  if (sw * .8 > kx + 14) { c.fillStyle = `rgba(255,255,255,${(.34 * a * ahead).toFixed(3)})`; c.beginPath(); c.arc(sw * .8, h / 2, 2.4, 0, 6.3); c.fill(); }
  if (sw * .91 > kx + 14) { c.fillStyle = `rgba(255,255,255,${(.78 * a * ahead).toFixed(3)})`; c.beginPath(); c.arc(sw * .91, h / 2, 2.9, 0, 6.3); c.fill(); }
}

/* ════════════ 05 · COMPLETED ════════════ */
/* demo data: 14 weeks (Sun-first rows) ending Wed 14 Oct 2026 */
const HEAT = [
  [0, 2, 2, 0, 0, 3, 1, 1, 3, 1, 0, 0, 1, 3],
  [2, 4, 0, 3, 0, 3, 2, 2, 3, 3, 3, 2, 3, 3],
  [3, 1, 2, 0, 1, 3, 3, 2, 0, 3, 3, 3, 1, 1],
  [1, 0, 2, 4, 1, 3, 3, 1, 0, 0, 2, 0, 2, 0],
  [3, 1, 1, 2, 3, 0, 2, 1, 3, 0, 0, 1, 3, -1],
  [1, 1, 2, 0, 2, 0, 0, 2, 3, 0, 0, 1, 2, -1],
  [1, 1, 2, 2, 1, 1, 0, 3, 3, 0, 1, 0, 2, -1],
];
const cm = { cells: [], stats: [] };
SC.push({
  name: 'Completed', dur: 6.0,
  init() {
    const grid = $('#grid'), start = new Date(2026, 6, 12);
    for (let c = 0; c < 14; c++) for (let r = 0; r < 7; r++) {
      const l = HEAT[r][c], el = document.createElement('i');
      if (l < 0) el.className = 'void';
      else { el.dataset.l = l; if (c === 13 && r === 3) el.className = 'today'; }
      el.dataset.c = c; el.dataset.r = r;
      grid.append(el); cm.cells.push({ el, c, r, l, h: hash(c * 17 + r, 9) });
    }
    const mo = $('#months');
    [['Jul', 0], ['Aug', 3], ['Sep', 8], ['Oct', 12]].forEach(([n, c]) => { const e = document.createElement('em'); e.textContent = n; e.style.left = (c / 14 * 100) + '%'; mo.append(e); });
    cm.mo = mo; cm.head = $('#cmHead'); cm.leg = $('#cmLeg'); cm.box = $('#cmStats'); cm.root = $('#cm'); cm.tip = $('#tip'); cm.grid = grid;
    cm.stats = $$('#cmStats > div');
    cm.today = cm.cells.find(c => c.el.classList.contains('today'));
    const fmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    grid.addEventListener('pointermove', e => {
      const i = e.target.closest && e.target.closest('i');
      if (!i || i.classList.contains('void') || cur !== 4) return cmTip(null);
      const lt = curLt(4); if (lt < 2 || lt > 4.9) return cmTip(null);
      holdFor(1.4);
      const c = +i.dataset.c, r = +i.dataset.r, d = new Date(start.getTime() + (c * 7 + r) * 864e5);
      const n = i.classList.contains('today') ? null : [0, 1, 2, 4, 7][+i.dataset.l];
      cmTip(i, `${n === null ? 'Today · in progress' : n + (n === 1 ? ' task' : ' tasks')}<small>${fmt.format(d)}</small>`);
    });
    grid.addEventListener('pointerleave', () => cmTip(null));
  },
  enter() { cmTip(null); },
  leave() { cmTip(null); },
  render(lt) {
    const ex = prog(lt, 5.0, 5.85);
    for (const o of cm.cells) {
      const start = .25 + (13 - o.c) * .055 + o.r * .014 + o.h * .1;
      const p = prog(lt, start, start + .5);
      let op = eo3(p), tx = 0, bl = (1 - p) * 3.2, sc = lerp(.35, 1, eoB(p));
      if (o === cm.today) { op = clamp(p * 1.6) * (1 - sstep(5.55, 5.8, lt)); }
      else if (ex > 0) { const q = prog(ex, (1 - o.c / 14) * .35, (1 - o.c / 14) * .35 + .5); op *= 1 - q; tx = -q * (24 + o.h * 50); bl += q * 6; }
      const s = o.el.style;
      s.opacity = op.toFixed(3);
      const scT = o === cm.today ? (p < 1 ? sc : 1 + .45 * sstep(5.1, 5.5, lt)) : sc;
      s.transform = p < 1 || ex > 0 || o === cm.today ? `translateX(${tx.toFixed(1)}px) scale(${scT.toFixed(3)})` : 'none';
      s.filter = bl > .1 ? `blur(${bl.toFixed(2)}px)` : 'none';
    }
    const glowT = sstep(5.1, 5.45, lt);
    cm.today.el.style.background = glowT > .01 ? rgba(WHITE, glowT) : '';
    cm.today.el.style.boxShadow = glowT > .01 ? `0 0 ${(26 * glowT).toFixed(0)}px rgba(${rgb3(TH.glow)},.95)` : '';
    const fade = 1 - prog(lt, 5.0, 5.5), hA = prog(lt, .9, 1.5);
    cm.head.style.opacity = hA * fade; cm.head.style.transform = `translateY(${((1 - hA) * 8).toFixed(1)}px)`;
    cm.mo.style.opacity = prog(lt, 1.1, 1.6) * fade;
    cm.leg.style.opacity = prog(lt, 1.7, 2.2) * fade;
    cm.box.style.borderColor = `rgba(255,255,255,${(.1 * prog(lt, 2.0, 2.5) * fade).toFixed(3)})`;
    cm.stats.forEach((d, i) => {
      const s0 = 2.1 + i * .18, p = prog(lt, s0, s0 + .55), b = d.firstElementChild;
      d.style.opacity = eo3(p) * fade; d.style.filter = p < 1 ? `blur(${((1 - p) * 4).toFixed(1)}px)` : 'none';
      const v = +b.dataset.v, dd = +b.dataset.d, q = eo3(prog(lt, s0, s0 + 1));
      b.textContent = (v * q).toFixed(dd);
    });
    if (fade < .98) cmTip(null);
  },
});
function cmTip(i, html) {
  const t = cm.tip;
  $$('#grid .hov').forEach(e => e.classList.remove('hov'));
  if (!i) { t.style.opacity = 0; return; }
  i.classList.add('hov');
  const r = rectW(i), b = rectW(cm.root);
  t.innerHTML = html; t.style.opacity = 1;
  t.style.left = (r.cx - b.x) + 'px'; t.style.top = (r.y - b.y) + 'px';
}

/* ════════════ 06 · WELCOME ════════════ */
const wl = { text: 'Welcome to Orbit.', pos: [], spans: [] };
SC.push({
  name: 'Orbit', dur: 6.6,
  init() {
    const t = $('#wlTitle');
    [...wl.text].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; t.append(s); wl.spans.push(s); });
    wl.soon = $('#soon'); wl.title = t;
    window.__onLayout = wlMeasure;
  },
  enter() { wl.spans.forEach((s, i) => { s.textContent = wl.text[i]; }); },
  render(lt) {
    const out = 1 - sstep(5.7, 6.5, lt);
    if (!wl.pos.length) wlMeasure();
    const u = eio2(prog(lt, 1.0, 2.35)), x0 = wl.pos[0].x - 22, xl = wl.pos[wl.pos.length - 1].x;
    const reach = lerp(x0, xl + 70, u), back = eio3(prog(lt, 2.35, 2.8));
    wl.head = { x: lerp(reach, xl, back), y: wl.base, u };
    wl.spans.forEach((s, i) => {
      const q = clamp((reach - (wl.pos[i].x - 14)) / 60) * (lt > 1.0 ? 1 : 0);
      if (q <= 0) { s.style.opacity = 0; return; }
      if (q < 1 && wl.text[i] !== ' ' && wl.text[i] !== '.') s.textContent = q < .55 ? 'abcdefghilmnoprtw'[Math.random() * 17 | 0] : wl.text[i]; else s.textContent = wl.text[i];
      s.style.opacity = (q * out).toFixed(3);
      s.style.filter = q < 1 ? `blur(${((1 - q) * 5).toFixed(1)}px)` : 'none';
      s.style.transform = q < 1 ? `translateY(${((1 - q) * 6).toFixed(1)}px)` : 'none';
    });
    wl.soon.style.opacity = sstep(3.3, 3.9, lt) * out;
    wl.soon.style.filter = `blur(${((1 - sstep(3.3, 3.9, lt)) * 4).toFixed(1)}px)`;
    wl.smoke = sstep(2.3, 3.8, lt) * out;
    wl.dotA = lt > .7 ? (1 - sstep(2.75, 3.3, lt)) * (lt < 1.0 ? .75 + .25 * Math.sin(lt * 30) : 1) : 0;
  },
});
function wlMeasure() {
  if (!wl.spans.length) return;
  const tr = rectW(wl.title);
  wl.pos = wl.spans.map(s => { const r = rectW(s); return { x: r.cx, w: r.w }; });
  wl.base = tr.cy + tr.h * .3;
}

/* ───────── timeline, comets, controls ───────── */
let TOTAL = 0;
SC.forEach((s, i) => { s.t0 = TOTAL; TOTAL += s.dur; s.el = $('#s' + i); });
const t_ = (i, lt) => SC[i].t0 + lt;
function seekTo(i, lt) { T = SC[i].t0 + lt; holdUntil = 0; }

/* analytic anchors, so comets can aim at scenes that are not on screen yet */
const A = {
  cubeStart: () => [WW / 2 - U.tw / 2 + U.cube / 2, CY + 8],
  cubeEnd: () => [WW / 2 + U.tw / 2 - U.cube / 2, CY + 8],
  orb: (nx, ny) => [WW / 2 + (nx - .5) * U.prW, CY - 20 + (ny - .5) * U.prH],
  mic: () => [WW / 2 - U.cpW / 2 + 38, CY - U.cpH / 2 - 10 + U.cpH - 38],
  pill: () => [WW / 2, CY],
  today: () => {
    const g = rectW($('#grid')), cw = (g.w - 13 * 6) / 14;
    return [g.x + 13 * (cw + 6) + cw / 2, g.y + 3 * (cw + 6) + cw / 2];
  },
  wl: () => { if (!wl.pos.length) wlMeasure(); return [wl.pos[0].x - 22, wl.base]; },
};
const comets = [
  { a: t_(0, .02), b: t_(0, .95), len: .3, w: 3.4, make: () => { const e = A.cubeStart(); return bez([WW + 70, -60], [WW * .7, WH * .08], [e[0] + 120, e[1] - 230], e); } },
  { a: t_(0, 4.3), b: t_(1, .78), len: .32, w: 3.2, make: () => { const s = A.cubeEnd(), e = A.orb(.5, .78); return bez(s, [s[0] + 140, s[1] - 250], [e[0] - 30, e[1] - 380], e); } },
  { a: t_(1, 5.4), b: t_(2, .55), len: .3, w: 3, make: () => { const s = A.orb(.8, .22), e = A.mic(); return bez(s, [s[0] - 120, s[1] - 200], [e[0] - 160, e[1] - 300], e); } },
  { a: t_(2, 7.28), b: t_(3, .5), len: .34, w: 3.2, make: () => { const r = rectW(cpS.send), s = [r.cx, r.cy], e = A.pill(); return bez(s, [s[0] + 70, s[1] - 330], [e[0] + 30, e[1] - 420], e); } },
  { a: t_(4, -.85), b: t_(4, .25), len: .3, w: 3.2, make: () => { const e = A.today(); return bez([e[0] - 150, -50], [e[0] - 90, e[1] * .35], [e[0] - 30, e[1] * .7], e); } },
  { a: t_(4, 5.35), b: t_(5, .75), len: .3, w: 3, make: () => { const s = A.today(), e = A.wl(); return bez(s, [s[0] + 90, s[1] + 160], [e[0] + 260, e[1] + 200], e); } },
  { a: t_(5, 0), b: t_(5, .95), len: .5, w: 2.6, make: () => bez([WW * .5, WH + 60], [WW * .5 + 40, WH * .82], [WW * .6, WH * .78], [WW * .66, WH * .7]) },
  { a: t_(5, .12), b: t_(5, 1.05), len: .5, w: 2.4, make: () => bez([WW + 50, WH * .95], [WW * .96, WH * .82], [WW * .91, WH * .74], [WW * .86, WH * .7]) },
];
const prevLayoutHook = window.__onLayout;
window.__onLayout = () => { prevLayoutHook && prevLayoutHook(); comets.forEach(c => { c.path = null; }); };

function drawFX() {
  const ff = $('#fx'), fb = $('#fxb'), c = ctxs.fx, b = ctxs.fxb;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, ff.width, ff.height); c.setTransform(k * DPR, 0, 0, k * DPR, 0, 0);
  b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, fb.width, fb.height); b.setTransform(k * DPR, 0, 0, k * DPR, 0, 0);
  for (const cm_ of comets) {
    const u = (T - cm_.a) / (cm_.b - cm_.a);
    if (u < 0 || u > 1.32) { cm_.path = null; continue; }
    if (!cm_.path) cm_.path = cm_.make();
    drawComet(c, T, cm_);
  }
  if (cur === 5) {
    const lt = curLt(5);
    if (wl.dotA > .01 && wl.head) {
      const h = wl.head, sp = Math.sin(Math.PI * clamp(h.u));
      if (sp > .05) {
        const g = c.createLinearGradient(h.x - 80 * sp, h.y, h.x, h.y);
        g.addColorStop(0, rgba(TH.glow, 0)); g.addColorStop(1, rgba(mixc(TH.glow, WHITE, .7), .8 * wl.dotA));
        c.strokeStyle = g; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(h.x - 80 * sp, h.y); c.lineTo(h.x, h.y); c.stroke();
      }
      glowDot(c, h.x, h.y, 20, wl.dotA, TH.glow);
      c.fillStyle = `rgba(255,255,255,${wl.dotA.toFixed(3)})`; c.beginPath(); c.arc(h.x, h.y, 3.3, 0, 6.3); c.fill();
    }
    drawSmoke(b, lt, wl.smoke || 0);
  }
}

/* ───────── scene activation & main loop ───────── */
function activate(i) {
  if (i === cur) return;
  if (cur >= 0) { SC[cur].leave && SC[cur].leave(); SC[cur].el.classList.remove('on'); }
  cur = i;
  SC[i].el.classList.add('on');
  SC[i].enter && SC[i].enter();
}
let last = performance.now(), frameN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { step(dt); } catch (err) { if (!frame.warned) { frame.warned = true; console.error('aureole frame error', err); } }
}
function step(dt) {
  tickTheme(dt);
  const hold = isHeld() || lv.drag.on || pr.drag.on || tk.drag.on;
  if (!paused && !hold) { T += dt; if (T >= TOTAL) T -= TOTAL; }
  let i = SC.findIndex(s => T >= s.t0 && T < s.t0 + s.dur);
  if (i < 0) i = SC.length - 1;
  activate(i);
  tapOn = false;
  SC[i].render(T - SC[i].t0, dt);
  if (!tapOn) tapEl.style.opacity = 0;
  drawFX();
  if ((frameN++ & 3) === 0) updateChapters();
}

/* ───────── dock ───────── */
const chap = $('#chap');
SC.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', s.name);
  b.innerHTML = `${s.name}<i></i>`;
  b.addEventListener('click', () => { seekTo(i, 0); paused = false; syncPlay(); });
  chap.append(b);
});
function updateChapters() {
  $$('button', chap).forEach((b, i) => {
    const p = i < cur ? 1 : i > cur ? 0 : clamp((T - SC[i].t0) / SC[i].dur);
    b.style.setProperty('--p', p.toFixed(3));
    b.classList.toggle('cur', i === cur);
  });
}
function syncPlay() {
  $('#icPause').style.display = paused ? 'none' : '';
  $('#icPlay').style.display = paused ? '' : 'none';
  $('#btnPlay').setAttribute('aria-label', paused ? '播放' : '暂停');
}
function togglePlay() { paused = !paused; syncPlay(); }
$('#btnPlay').addEventListener('click', togglePlay);
$('#btnReplay').addEventListener('click', () => { T = 0; holdUntil = 0; paused = false; syncPlay(); });
$$('#themes button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
const dock = $('#dock');
dock.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') { dock.classList.add('touch'); clearTimeout(dock._t); dock._t = setTimeout(() => dock.classList.remove('touch'), 3500); } });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const kk = e.key;
  if (kk === ' ' || kk === 'k') { e.preventDefault(); togglePlay(); }
  else if (kk === '1') setTheme('orbit'); else if (kk === '2') setTheme('loyel'); else if (kk === '3') setTheme('aurora');
  else if (kk === 'ArrowRight') { seekTo((cur + 1) % SC.length, 0); }
  else if (kk === 'ArrowLeft') { seekTo((cur - 1 + SC.length) % SC.length, 0); }
  else if (kk === 'r') { T = 0; holdUntil = 0; paused = false; syncPlay(); }
});
stage.addEventListener('pointermove', e => { ptr.x = e.clientX / k; ptr.y = e.clientY / k; ptr.on = true; });
stage.addEventListener('pointerleave', () => { ptr.x = ptr.y = -999; });

/* ───────── boot ───────── */
SC.forEach(s => s.init && s.init());
layout();
let saved = null; try { saved = localStorage.getItem('aureole-theme'); } catch (e) { /* ignore */ }
setTheme(THEMES[saved] ? saved : 'loyel', true);
applyCSS();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paused = true; T = t_(3, 2.9); }
syncPlay();
addEventListener('resize', () => requestAnimationFrame(layout));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); });
setTimeout(() => { const h = $('#hint'); if (h) h.style.transition = 'opacity 1.2s', h.style.opacity = 0; }, 9000);
requestAnimationFrame(frame);

/* small hook for testing and embedding */
window.aureole = {
  get T() { return T; }, total: TOTAL, scenes: SC.map(s => ({ name: s.name, t0: s.t0, dur: s.dur })),
  seek: t => { T = t; holdUntil = 0; }, seekScene: seekTo,
  pause: () => { paused = true; syncPlay(); }, play: () => { paused = false; syncPlay(); }, theme: setTheme,
};

})();
