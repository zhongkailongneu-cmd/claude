/* Layout: full-bleed WebGL field behind fixed text panels.
   Desktop: copy on the left, subject on the right, level ladder on the far right.
   Phone: subject in the upper half, copy anchored to the bottom over a scrim.
   Every UI colour comes from the Loyel blue scale; warm accents appear only in
   the particle legend, where they stand for signals. */
:root {
  --abyss: #02060d;
  --l10: #f4f7fb;
  --l20: #e8eef6;
  --l30: #ccdbeb;
  --l40: #9fbdda;
  --l50: #6c9ac4;
  --l60: #497dae;
  --l70: #376392;
  --l80: #2e5076;
  --l90: #2b4868;
  --l100: #263b54;
  --ink: var(--l20);
  --ink-soft: var(--l30);
  --label: var(--l40);
  --rule: var(--l50);
  --neon-core: var(--l10);
  --neon: var(--l50);

  /* driven by the settings panel */
  --f-display: "Oswald", "Arial Narrow", sans-serif;
  --display-weight: 500;
  --fw: 0.48;
  --title-scale: 1;
  --stroke-k: 1;
  --glow-k: 1;
  --neon-filter: none;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --gutter: clamp(16px, 5.5vw, 96px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; background: var(--abyss); }
body {
  margin: 0;
  background: var(--abyss);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: pan-y;
}

#track > div { height: 100vh; height: 100lvh; scroll-snap-align: start; }

/* ---------- hollow neon type ---------- */
.neon {
  color: transparent;
  -webkit-text-stroke: calc(var(--stroke, 1.5px) * var(--stroke-k)) var(--neon-core);
  filter: var(--neon-filter);
  font-family: var(--f-display);
  font-weight: var(--display-weight);
}
@supports not (-webkit-text-stroke: 1px black) {
  .neon { color: var(--l20); }
}
.neon .ln { display: block; white-space: nowrap; }
.neon .ch { display: inline-block; }
.panel.is-active .neon .ch { animation: neon-on 1.5s calc(var(--d, 0) * 55ms + 120ms) both; }
@keyframes neon-on {
  0% { opacity: 0; }
  7% { opacity: 0.9; }
  11% { opacity: 0.1; }
  19% { opacity: 1; }
  24% { opacity: 0.3; }
  32%, 100% { opacity: 1; }
}

/* ---------- panels ---------- */
#panels { position: relative; z-index: 2; }
.panel {
  position: fixed;
  inset: 0;
  display: grid;
  align-items: center;
  padding-inline: var(--gutter) calc(var(--gutter) + 40px);
  padding-block: 84px 56px;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  will-change: opacity, transform;
}
.copy {
  display: grid;
  gap: 14px;
  max-width: min(46vw, 660px);
  min-width: 0;
}
.copy a, .copy button { pointer-events: auto; }

.eyebrow {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  font-size: 13px;
  letter-spacing: 0.08em;
  color: var(--label);
}
.eyebrow .lvl {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--l10);
  padding: 1px 8px;
  border: 1px solid color-mix(in srgb, var(--l50) 70%, transparent);
  border-radius: 999px;
  box-shadow: 0 0 calc(10px * var(--glow-k)) -2px var(--l50);
}
.eyebrow .idx { font-family: var(--f-mono); font-size: 11px; color: var(--rule); letter-spacing: 0.16em; }

.name {
  --stroke: 1.5px;
  margin: 2px 0 0;
  line-height: 1.04;
  letter-spacing: 0.035em;
  font-size: min(
    calc(clamp(30px, min(8vw, calc(42vw / (var(--len, 8) * var(--fw)))), 150px) * var(--title-scale)),
    calc(46vw / (var(--len, 8) * var(--fw)))
  );
}
.line {
  margin: 0;
  max-width: 34em;
  font-size: clamp(16px, 1.4vw, 21px);
  line-height: 1.6;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--l10);
  text-shadow: 0 0 calc(18px * var(--glow-k)) color-mix(in srgb, var(--l60) 70%, transparent), 0 0 3px var(--abyss);

}
.body {
  margin: 0;
  max-width: 40em;

.facts {

}
.facts > div { padding: 10px 14px 0 0; min-width: 0; }
.facts dt { font-size: 11px; letter-spacing: 0.14em; color: var(--rule); }

}
.legend {
  list-style: none;

}
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.legend i {

  box-shadow: 0 0 calc(8px * var(--glow-k) + 2px) var(--c);
}
.evidence {
  margin: 0;
  max-width: 44em;
  font-size: 12px;
  line-height: 1.7;
  color: var(--label);
}
.evidence .tag {
  display: inline-block;
  margin-right: 8px;
  padding: 0 6px;
  font-size: 11px;
  color: var(--l20);
  background: color-mix(in srgb, var(--l70) 55%, transparent);
  border-radius: 3px;
}

/* rise-in for the plain-type parts of the active panel */
.panel .rise { transition: transform 0.9s cubic-bezier(.2,.7,.1,1), opacity 0.9s; }
.panel:not(.is-active) .rise { transform: translateY(12px); opacity: 0.4; }
.panel.is-active .rise:nth-child(3) { transition-delay: 0.1s; }
.panel.is-active .rise:nth-child(4) { transition-delay: 0.18s; }
.panel.is-active .rise:nth-child(5) { transition-delay: 0.26s; }
.panel.is-active .rise:nth-child(6) { transition-delay: 0.34s; }
.panel.is-active .rise:nth-child(7) { transition-delay: 0.42s; }

/* hero + outro: centred over the subject */
.panel--center { justify-items: center; text-align: center; padding-inline: var(--gutter); }
.panel--center .copy { justify-items: center; max-width: min(92vw, 1200px); }
.panel--center .name {
  --stroke: 2px;
  font-size: min(
    calc(clamp(28px, min(14vw, calc(78vw / (var(--len, 8) * var(--fw)))), 230px) * var(--title-scale)),
    calc(82vw / (var(--len, 8) * var(--fw)))
  );
}
.panel--center .line { font-size: clamp(17px, 1.7vw, 24px); max-width: 30em; }
.panel--center .body { max-width: 40em; text-align: center; text-shadow: 0 0 10px var(--abyss), 0 0 22px var(--abyss), 0 0 3px var(--abyss); }
.panel--outro .name { font-size: min(calc(clamp(26px, min(10vw, calc(80vw / (var(--len, 8) * var(--fw)))), 190px) * var(--title-scale)), calc(88vw / (var(--len, 8) * var(--fw)))); }
.panel--hero .copy { position: relative; transform: translateY(-2vh); }
/* A soft dark pool behind the opening copy, so it reads over the bright soma. */
.panel--hero .copy::before {
  content: "";
  position: absolute;
  inset: 18% 4% -6%;
  z-index: -1;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--abyss) 62%, transparent), transparent);
  pointer-events: none;
}

.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
.cta {
  appearance: none;
  border: 1px solid color-mix(in srgb, var(--l40) 75%, transparent);
  background: color-mix(in srgb, var(--abyss) 55%, transparent);
  color: var(--l10);
  font-family: var(--f-body);
  font-size: 14px;
  letter-spacing: 0.16em;
  padding: 13px 24px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 calc(18px * var(--glow-k)) -4px var(--l50), inset 0 0 14px -6px var(--l50);
  transition: box-shadow 0.3s, background 0.3s, transform 0.3s;
}
.cta:hover { box-shadow: 0 0 calc(30px * var(--glow-k) + 4px) -2px var(--l50), inset 0 0 18px -4px var(--l50); transform: translateY(-1px); }
.cta--quiet { border-color: color-mix(in srgb, var(--rule) 50%, transparent); box-shadow: none; color: var(--label); }
.credits { margin: 8px 0 0; font-size: 12px; letter-spacing: 0.06em; color: var(--rule); }
:focus-visible { outline: 2px solid var(--l40); outline-offset: 3px; }

/* ---------- chrome ---------- */
.topbar {
  position: fixed;
  z-index: 6;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) var(--gutter) 16px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  font-family: var(--f-display);
  font-weight: var(--display-weight);
  font-size: 15px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
}
.brand span { color: transparent; -webkit-text-stroke: 0.7px var(--neon-core); filter: drop-shadow(0 0 calc(4px * var(--glow-k)) var(--l50)); margin-left: 0.3em; }
.tools { display: flex; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--rule) 45%, transparent);
  background: color-mix(in srgb, var(--abyss) 55%, transparent);
  color: var(--label);
  font-family: var(--f-body);
  font-size: 13px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.chip:hover { color: var(--l10); border-color: color-mix(in srgb, var(--l40) 75%, transparent); }
.chip[aria-pressed="true"], .chip[aria-expanded="true"] { color: var(--l10); border-color: color-mix(in srgb, var(--l40) 80%, transparent); box-shadow: 0 0 16px -6px var(--l50); }
.chip--small { padding: 6px 12px; font-size: 12px; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.bars i { display: block; width: 2px; height: 3px; background: currentColor; border-radius: 1px; }
#sound[aria-pressed="true"] .bars i { animation: bar 1.1s ease-in-out infinite alternate; }
#sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.4s; }
#sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -0.8s; }
#sound[aria-pressed="true"] .bars i:nth-child(4) { animation-delay: -0.2s; }
#sound[aria-pressed="true"] .bars i:nth-child(5) { animation-delay: -0.6s; }
@keyframes bar { from { height: 2px; } to { height: 12px; } }

/* ---------- level ladder ---------- */
.rail {
  position: fixed;
  z-index: 4;
  right: calc(var(--gutter) * 0.4);
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  gap: 1px;
}
.rail button {
  appearance: none;
  background: none;
  border: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 4px 0;
  cursor: pointer;
  color: var(--rule);
  font-size: 12px;
}
.rail .lbl { opacity: 0; transform: translateX(6px); transition: opacity 0.3s, transform 0.3s; color: var(--label); }
.rail .code { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; min-width: 3.4em; text-align: right; }
.rail button:hover .lbl, .rail button[aria-current="true"] .lbl { opacity: 1; transform: none; }
.rail button[aria-current="true"] { color: var(--l10); }
.rail button[aria-current="true"] .lbl { color: var(--l10); }
.rail .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.rail button[aria-current="true"] .dot { background: var(--l30); border-color: var(--l30); box-shadow: 0 0 calc(10px * var(--glow-k) + 2px) var(--l50); }

/* ---------- settings ---------- */
.settings {
  position: fixed;
  z-index: 7;
  top: calc(64px + env(safe-area-inset-top, 0px));
  right: var(--gutter);
  width: min(360px, calc(100vw - 32px));
  max-height: calc(100vh - 84px - env(safe-area-inset-top, 0px));
  max-height: calc(100dvh - 84px - env(safe-area-inset-top, 0px));
  display: grid;
  grid-template-rows: auto 1fr auto;
  border: 1px solid color-mix(in srgb, var(--l50) 40%, transparent);
  border-radius: 16px;
  background: color-mix(in srgb, #050c18 86%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px -20px #000, 0 0 30px -18px var(--l50);
  color: var(--ink);
}
.settings[hidden] { display: none; }
.settings-head, .settings-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; }
.settings-head { border-bottom: 1px solid color-mix(in srgb, var(--l50) 25%, transparent); }
.settings-head h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.2em; color: var(--l10); }
.settings-foot { border-top: 1px solid color-mix(in srgb, var(--l50) 25%, transparent); }
.settings-foot p { margin: 0; font-size: 11px; color: var(--rule); }
.settings-body { overflow-y: auto; padding: 4px 18px 10px; overscroll-behavior: contain; }
.settings section { padding: 10px 0 6px; }
.settings section + section { border-top: 1px dashed color-mix(in srgb, var(--l50) 22%, transparent); }
.settings h3 { margin: 4px 0 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.24em; color: var(--rule); }
.settings .row {
  display: grid;
  grid-template-columns: 4.5em 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  font-size: 13px;
  color: var(--ink-soft);
}
.settings .row > span { white-space: nowrap; }
.settings .row:has(.seg) { grid-template-columns: 4.5em 1fr; }
.settings .row--stack { grid-template-columns: 1fr !important; gap: 6px; }
.settings output { font-family: var(--f-mono); font-size: 11px; color: var(--label); min-width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; }
.settings input[type=range] { width: 100%; accent-color: var(--l50); height: 22px; background: transparent; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  appearance: none;
  flex: 1 1 auto;
  min-width: 3em;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--l50) 35%, transparent);
  background: color-mix(in srgb, var(--l100) 35%, transparent);
  color: var(--label);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.seg button[aria-checked="true"] { color: var(--l10); border-color: var(--l40); background: color-mix(in srgb, var(--l70) 45%, transparent); box-shadow: 0 0 12px -6px var(--l50); }
.seg button:disabled { opacity: 0.35; cursor: not-allowed; }
.seg--fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); }
.seg--fonts button { display: grid; gap: 1px; text-align: left; padding: 7px 10px; }
.seg--fonts b { font-weight: inherit; font-size: 15px; letter-spacing: 0.04em; color: inherit; }
.seg--fonts small { font-family: var(--f-body); font-size: 10.5px; color: var(--rule); }
.settings .preview {
  --stroke: 1.2px;
  margin: 10px 0 2px;
  text-align: center;
  font-size: calc(min(44px, calc(300px / (10 * var(--fw)))) * var(--title-scale));
  line-height: 1.2;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
}

/* ---------- click feedback ---------- */
.sparks { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.spark {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--l10);
  text-shadow: 0 0 calc(10px * var(--glow-k) + 2px) var(--l50);
  white-space: nowrap;
  animation: spark 1.4s ease-out forwards;
}
.spark b { font-weight: 500; color: var(--l10); }
.spark small { margin-left: 6px; font-family: var(--f-body); font-size: 11px; letter-spacing: 0.04em; color: var(--l30); }
@keyframes spark { 0% { opacity: 0; transform: translate(-50%, -30%); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }

.hint {
  position: fixed;
  z-index: 3;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--label);
  transition: opacity 0.5s;
  pointer-events: none;
}
.hint i { width: 1px; height: 32px; background: linear-gradient(var(--l40), transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

.loader {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--abyss);
  transition: opacity 1s ease, visibility 1s;
}
.loader-word { --stroke: 1.2px; margin: 0; font-size: min(64px, calc(86vw / (15 * var(--fw)))); letter-spacing: 0.06em; animation: neon-on 2.4s infinite; }
.loader-note { margin: 0; font-size: 13px; letter-spacing: 0.12em; color: var(--label); font-variant-numeric: tabular-nums; }
body.ready .loader { opacity: 0; visibility: hidden; }

.noscript { position: fixed; inset: auto 16px 24px; z-index: 20; color: var(--ink); text-align: center; }

/* ---------- shorter desktop windows ---------- */
@media (max-height: 820px) and (min-aspect-ratio: 1/1) {
  .copy { gap: 10px; }
  .evidence { display: none; }
  .body { line-height: 1.7; }
}
@media (max-height: 660px) and (min-aspect-ratio: 1/1) {
  .legend { display: none; }
}

/* ---------- phone / portrait ---------- */
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  .panel { align-items: end; padding-block: 64px calc(24px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px 34px; }
  .panel--side::before {
    content: "";
    position: absolute;
    inset: 40% 0 0 0;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--abyss) 86%, transparent) 34%);
    z-index: -1;
  }
  .copy { max-width: 100%; gap: 9px; }
  .name {
    font-size: min(calc(clamp(26px, min(14vw, calc(80vw / (var(--len, 8) * var(--fw)))), 96px) * var(--title-scale)), calc(82vw / (var(--len, 8) * var(--fw))));
  }
  .panel--center { align-items: center; padding-inline: 16px 30px; }
  .panel--center .name { font-size: min(calc(clamp(24px, calc(88vw / (var(--len, 8) * var(--fw))), 120px) * var(--title-scale)), calc(90vw / (var(--len, 8) * var(--fw)))); }
  .line { font-size: clamp(15px, 4.2vw, 18px); }
  .body { font-size: 13.5px; line-height: 1.7; }
  .facts dd { font-size: 13px; }
  .evidence { display: none; }
  .legend { font-size: 11px; gap: 4px 12px; }
  .rail { right: 6px; gap: 0; }
  .rail .lbl { display: none; }
  .rail .code { display: none; }
  .rail button[aria-current="true"] .code { display: inline; }
  .rail button { padding: 3px 0; }
  .rail .dot { width: 6px; height: 6px; }
  .topbar { padding-inline: 16px; }
  .brand { font-size: 13px; letter-spacing: 0.12em; }
  .chip { padding: 7px 11px; font-size: 12px; }
  .settings { right: 16px; }
}
@media (max-aspect-ratio: 1/1) and (max-height: 760px) {
  .panel--side .body { display: none; }
}
@media (max-height: 560px) {
  .panel .body, .legend { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-snap-type: none; }
  .panel.is-active .neon .ch, .loader-word, .hint i, #sound[aria-pressed="true"] .bars i, .spark { animation: none; }
  .panel .rise { transition: none; }
}
</style>

// 2 \xB7 dendritic spines: potentiated heads swell in four staggered groups; filopodia probe.
float axisY(float x) { return 0.25 * sin(x * 0.35); }
