<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader" class="loader" role="status" aria-live="polite">
  <p class="loader-word neon" lang="en">NEUROPLASTICITY</p>
  <p class="loader-note">正在唤醒 <span id="loader-count">0</span> 个荧光粒子</p>
</div>

<header class="topbar">
  <a class="brand" href="#top" data-go="0" lang="en">Neuro<span>Plasticity</span></a>
  <div class="tools">
    <button id="sound" class="chip" type="button" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="sound-label">声音 关</span>
    </button>
    <button id="settings-toggle" class="chip" type="button" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>调节</span>
    </button>
  </div>
</header>

<aside id="settings" class="settings" aria-label="显示与声音设置" hidden>
  <div class="settings-head">
    <h2>调节</h2>
    <button class="chip chip--small" type="button" data-close>关闭</button>
  </div>
  <div class="settings-body"></div>
  <div class="settings-foot">
    <button class="chip chip--small" type="button" data-reset>恢复默认</button>
    <p>设置保存在本浏览器中</p>
  </div>
</aside>

<nav id="rail" class="rail" aria-label="层级导航"></nav>

<main id="panels"></main>

<div id="track" aria-hidden="true"></div>

<div id="sparks" class="sparks" aria-hidden="true"></div>

<div id="hint" class="hint" aria-hidden="true"><span>向下滚动 · 自下而上穿越层级</span><i></i></div>

<noscript>
  <p class="noscript">这个页面用 WebGL 和 JavaScript 绘制粒子。请开启 JavaScript 后再访问。</p>
</noscript>
